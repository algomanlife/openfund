# Openfund — production deployment blueprint (Render, Infrastructure as Code)
#
# Full platform graph, deployable from this one repository:
#
#   openfund-db    Render Postgres 17  — the single persistent store (app tables
#                                     + Directus CMS tables; one database on
#                                     purpose: Directus is the editing surface
#                                     for catalog tables such as challenge_plans)
#   openfund-cms   Directus 11.9.1 (official Docker image) — editorial content,
#                                     plan catalog editing, media (persistent disk)
#   openfund       Node web service   — backend API (SIWE auth, demo trading
#                                     engine, portfolio/journal APIs) AND the
#                                     built React app served same-origin at
#                                     /react/ (cookie sessions stay first-party;
#                                     hash routing needs no SPA fallback)
#
# Runtime model decisions (see docs/deployment/RENDER.md for rationale):
#  - one API process hosts the engine loop, SSE stream and Gains market data —
#    no separate worker/cron services are currently required
#  - the frontend is served by the API service (same-origin) rather than a
#    separate static site, to keep HttpOnly session cookies first-party
#  - media for Directus lives on a persistent disk; S3-compatible storage can
#    be enabled later via DIRECTUS_STORAGE_* env vars
#
# This blueprint is reviewed before applying: Render never provisions it
# automatically. Activate per docs/deployment/RENDER.md (manual, reviewed).

databases:
  - name: openfund-db
    databaseName: openfund
    user: openfund_app
    postgresMajorVersion: "17"
    plan: 0.1c-256mb          # smallest stable plan; upgrade path documented
    region: frankfurt          # closest to the primary audience

services:
  # ------------------------------------------------------------------ CMS --
  - type: web
    name: openfund-cms
    region: frankfurt        # private PostgreSQL connection stays in-region
    runtime: image
    image:
      url: docker.io/directus/directus:11.9.1
    plan: starter
    autoDeployTrigger: off      # data plane: deploy only after review
    healthCheckPath: /server/ping   # public liveness; /server/health needs a token on Directus 12 (works on 11 too)
    disk:                       # durable uploaded media (not ephemeral FS)
      name: directus-uploads
      mountPath: /directus/uploads
      sizeGB: 5
    envVars:
      - key: PORT
        value: 10000
      - key: DB_CLIENT
        value: pg
      - key: DB_CONNECTION_STRING
        fromDatabase:
          name: openfund-db
          property: connectionString
      - key: KEY
        generateValue: true     # random, generated once at first apply
      - key: SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false             # prompted at first apply — never in Git
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false             # e.g. https://openfund-cms.onrender.com
      - key: WEBSOCKETS_ENABLED
        value: "false"
      - key: CORS_ENABLED
        value: "true"
      - key: CORS_ORIGIN
        value: "true"           # public read API; writes stay admin-only
      - key: CORS_METHODS
        value: GET,HEAD,OPTIONS
      - key: MAX_PAYLOAD_SIZE
        value: 1mb
      - key: IP_TRUST_PROXY       # Render terminates TLS in front of the service. Explicit so Directus 12
        value: "true"             # (default false) keeps client-IP resolution identical to 11.x.
      - key: LICENSE_KEY          # Directus 12+ licence / Open Innovation Grant key (secret). Required before the
        sync: false               # image moves to 12.x (Core ignores field-level and row-level permission rules);
                                  # unset on 11.x. Never set together with LICENSE_TOKEN.

  # ------------------------------------------------- API + web (one origin) --
  - type: web
    name: openfund
    region: frankfurt
    runtime: node
    plan: starter
    numInstances: 1           # one existing engine/SSE process
    autoDeployTrigger: off
    healthCheckPath: /health
    buildCommand: node scripts/release/render-build.mjs
    startCommand: npm run migrate --prefix apps/backend && npm start --prefix apps/backend
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: openfund-db
          property: connectionString
      - key: ALLOWED_DOMAINS
        fromService:
          name: openfund
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME # SIWE uses the public browser origin
      - key: CORS_ORIGINS
        sync: false             # only needed for extra origins / custom domain
      - key: SESSION_TTL_HOURS
        value: "168"
      - key: VITE_DIRECTUS_HOST
        fromService:
          name: openfund-cms
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME # runtime fallback; never baked into JS
      - key: CMS_PUBLIC_URL
        sync: false             # preferred browser origin, e.g. https://cms.openfi.cloud
      - key: VITE_WALLETCONNECT_PROJECT_ID
        sync: false             # optional (full remote wallet list)
      - key: VITE_TELEGRAM_COMMUNITY_URL
        sync: false             # optional owner-verified t.me destination; unset = Coming Soon
      - key: VITE_DISCORD_COMMUNITY_URL
        sync: false             # optional owner-verified Discord invitation; unset = Coming Soon
      - key: VITE_INSTAGRAM_COMMUNITY_URL
        sync: false             # optional owner-verified Instagram profile; unset = Coming Soon
      - key: PURCHASE_PAYMENT_RECEIVER
        sync: false             # challenge payment destination address — deliberately unset:
                                # purchases stay disabled until an approved address is entered
      - key: PURCHASE_PAYMENT_CHAIN
        value: "42161"          # legacy single settlement chain (used only while PURCHASE_PAYMENT_CHAINS is unset)
      - key: PURCHASE_PAYMENT_CHAINS
        sync: false             # JSON list of DePay settlement chains: [{blockchain, token, receiver, routers?,
                                # tokenDecimals?, minConfirmations?}] — public values; unset = legacy single chain
      - key: PURCHASE_RPC_URLS
        sync: false             # secret: JSON map chain id / DePay blockchain name → dedicated RPC endpoint
      - key: PURCHASE_PAYMENT_TOKEN
        sync: false             # optional ERC-20 payment token contract
      - key: PURCHASE_PAYMENT_DECIMALS
        sync: false             # optional; must equal the token's decimals() when set —
                                # unset reads decimals from the contract (no silent default)
      - key: PURCHASE_RPC_URL
        sync: false             # dedicated RPC endpoint for the payment chain (secret);
                                # required in production, no public-RPC fallback
      - key: PURCHASE_ROUTER_ADDRESSES
        sync: false             # optional comma-separated approved payment routers
                                # (e.g. the DePay Payment Router on the configured chain)
      - key: PURCHASE_PAYMENT_MIN_CONFIRMATIONS
        sync: false             # finality depth before a payment provisions
                                # (unset = 12 in production, 0 elsewhere)
      - key: DEPAY_VERIFY_PUBLIC_KEY
        sync: false             # DePay "Verify" public key (PEM) from app.depay.com — verifies x-signature on
                                # the configuration request, callbacks and events; unset = all DePay routes off
      - key: DEPAY_CALLBACK_PUBLIC_KEY
        sync: false             # legacy name of DEPAY_VERIFY_PUBLIC_KEY (read only when that is unset)
      - key: AUTH_RPC_URL
        sync: false             # optional dedicated Arbitrum One RPC for SIWE contract-wallet (EIP-1271) checks
      - key: PURCHASE_LATE_GRACE_MINUTES
        value: "60"             # minutes after order expiry a verified payment still pays
      - key: ADMIN_API_TOKEN
        sync: false             # service token for the /admin operational API
                                # (user directory, withdrawal review) — unset = disabled
      - key: CSP_EXTRA_CONNECT
        sync: false             # optional extra connect-src origins for the CSP
                                # (production CMS is https, same as VITE_DIRECTUS_HOST)
      - key: INTERNAL_API_TOKEN
        sync: false             # optional constant-time token on the test-only /internal seam
      - key: VITE_DEPAY_WIDGET
        sync: false             # optional DePay widget toggle (1 = enabled)
      - key: VITE_DEPAY_WIDGET_URL
        sync: false             # approved DePay widget bundle URL (https); widget stays off without it
      - key: VITE_DEPAY_WIDGET_INTEGRITY
        sync: false             # Subresource Integrity hash (sha384-…) of that exact bundle
      - key: VITE_DEPAY_INTEGRATION_ID
        sync: false             # public DePay integration id from app.depay.com
      - key: DEPAY_CONFIG_PRIVATE_KEY
        sync: false             # secret: RSA private key (PEM) that signs the dynamic configuration
                                # DePay requests; its public half is stored on app.depay.com
      - key: CSP_EXTRA_SCRIPT_SRC
        sync: false             # optional https origins allowed to serve scripts (DePay widget)
      - key: CSP_EXTRA_FRAME_SRC
        sync: false             # optional https origins allowed in frames (DePay widget)
      - key: SIM_TEST_MODE
        value: ""               # internal test seam — never enabled in prod
      # ---- Economy / Openfund Treasury (docs/economy/TREASURY.md) ----
      - key: TREASURY_WALLET_ADDRESS
        sync: false             # PUBLIC treasury address only — unset = "Not configured";
                                # never a private key or seed phrase
      - key: TREASURY_CHAIN_ID
        sync: false             # treasury chain (defaults to PURCHASE_PAYMENT_CHAIN)
      - key: TREASURY_ASSETS
        sync: false             # JSON asset list with optional Chainlink price feeds
      - key: TREASURY_RPC_URL
        sync: false             # optional RPC endpoint (unset = chain default public RPC)
      - key: TREASURY_REFRESH_MINUTES
        value: "90"             # snapshot interval, clamped to 60–120
      - key: TREASURY_PRICE_MAX_AGE_MINUTES
        value: "1500"           # older Chainlink answers leave the asset unpriced
      # ---- Live Market Access (docs/economy/LIVE_MARKET_ACCESS.md) ----
      - key: LIVE_EXECUTION_ADAPTER
        value: none             # none | sandbox (refused in production) | gains (not available)
      - key: LIVE_SETTLEMENT_ADAPTER
        value: none             # none | sandbox (refused in production)
