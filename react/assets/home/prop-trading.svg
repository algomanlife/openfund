<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 320" role="img" aria-label="Openfund prop trading evaluation path">
  <!-- Openfund original — Illustration A: "Evaluation Path"
       Phases as ascending plateaus; milestones as lozenge checkpoints;
       a rising skill curve fills beneath. Palette: mint 82e7bd on 060808. -->
  <style>
    .of-grid { stroke: #82e7bd14; stroke-width: 1; }
    .of-path { fill: none; stroke: #82e7bd; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
               stroke-dasharray: 620; stroke-dashoffset: 620; animation: of-draw 2.4s cubic-bezier(.16,1,.3,1) .3s forwards; }
    .of-area { fill: url(#ofA); opacity: 0; animation: of-fade 1.2s ease 1.9s forwards; }
    .of-node { fill: #0b1411; stroke: #82e7bd; stroke-width: 2; }
    .of-node-done { fill: #82e7bd; }
    .of-ring { fill: none; stroke: #82e7bd55; animation: of-pulse 3.2s ease-out infinite; transform-origin: var(--cx) var(--cy); }
    .of-tick { stroke: #82e7bd40; stroke-width: 2; }
    .of-bar { fill: #82e7bd1f; }
    .of-bar.on { fill: #82e7bda8; }
    .of-flag { fill: none; stroke: #d5e6da; stroke-width: 1.6; opacity: .9; }
    @keyframes of-draw { to { stroke-dashoffset: 0; } }
    @keyframes of-fade { to { opacity: 1; } }
    @keyframes of-pulse { 0% { stroke-width: 2; opacity: .8 } 70% { stroke-width: 9; opacity: 0 } 100% { stroke-width: 9; opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .of-path { stroke-dashoffset: 0; } .of-area { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="ofA" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#82e7bd" stop-opacity=".22"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ofGlow" cx=".5" cy=".75" r=".75">
      <stop stop-color="#82e7bd" stop-opacity=".14"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="440" height="320" fill="url(#ofGlow)"/>

  <!-- quiet measurement grid -->
  <g class="of-grid">
    <path d="M30 250H410 M30 195H410 M30 140H410 M30 85H410"/>
    <path d="M30 262V80 M130 262V80 M230 262V80 M330 262V80"/>
  </g>

  <!-- progress bars: discipline ticks along the way -->
  <g>
    <rect class="of-bar" x="42" y="238" width="10" height="5" rx="1"/>
    <rect class="of-bar on" x="56" y="238" width="10" height="5" rx="1"/>
    <rect class="of-bar" x="142" y="182" width="10" height="5" rx="1"/>
    <rect class="of-bar on" x="156" y="182" width="10" height="5" rx="1"/>
    <rect class="of-bar on" x="170" y="182" width="10" height="5" rx="1"/>
    <rect class="of-bar" x="246" y="128" width="10" height="5" rx="1"/>
    <rect class="of-bar on" x="260" y="128" width="10" height="5" rx="1"/>
  </g>

  <!-- the evaluation path: three phases, ascending plateaus -->
  <path class="of-path" d="M30 240 H84 L100 226 H150 L172 196 H224 L246 168 H300 L326 128 H372 L392 92"/>

  <!-- area under the path -->
  <path class="of-area" d="M30 240 H84 L100 226 H150 L172 196 H224 L246 168 H300 L326 128 H372 L392 92 L400 320 H22 Z"/>

  <!-- phase checkpoints: lozenges (openfund diamond motif) -->
  <g>
    <rect class="of-node" x="86" y="216" width="17" height="17" transform="rotate(45 94.5 224.5)"/>
    <rect class="of-node" x="163" y="186" width="17" height="17" transform="rotate(45 171.5 194.5)"/>
    <rect class="of-node" x="237" y="158" width="17" height="17" transform="rotate(45 245.5 166.5)"/>
    <!-- final milestone: solid lozenge + pulse ring -->
    <circle class="of-ring" cx="392" cy="92" r="11" style="--cx:392px;--cy:92px"/>
    <rect class="of-node of-node-done" x="384" y="84" width="16" height="16" transform="rotate(45 392 92)"/>
  </g>

  <!-- risk guardrail: dashed boundary the path respects -->
  <path d="M30 60 H410" stroke="#e8948364" stroke-width="1.4" stroke-dasharray="3 7" fill="none"/>

  <!-- small ascending spark inside final node zone -->
  <path class="of-flag" d="M370 118 l7-8 7 4 8-12"/>

  <!-- ticks -->
  <g class="of-tick">
    <path d="M30 258v8 M130 258v8 M230 258v8 M330 258v8"/>
  </g>
</svg>
