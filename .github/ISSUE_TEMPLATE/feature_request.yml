name: Feature or change request
description: Propose a capability, policy-dependent change or documentation improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is affected and what is missing today
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: policy
    attributes:
      label: Does this depend on a business or governance decision?
      description: Pricing, commissions, payouts, coupons and treasury are decided by company management (ECONOMY.md); delegated domains by the Council (GOVERNANCE.md)
      options: ["No", "Yes — approved policy exists (link it)", "Yes — decision pending"]
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
