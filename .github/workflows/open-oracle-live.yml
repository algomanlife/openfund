name: Open Oracle public data validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - packages/open-oracle/**
      - .github/workflows/open-oracle-live.yml
permissions:
  contents: read
jobs:
  live-public-reads:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Read-only inventory and observations
        run: node packages/open-oracle/scripts/live.mjs packages/open-oracle/reports/live 60000
      - name: Preserve actual collection evidence, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: open-oracle-public-validation
          path: |
            packages/open-oracle/reports/live/validation-summary.json
            packages/open-oracle/reports/live/coverage-summary.json
          retention-days: 7
