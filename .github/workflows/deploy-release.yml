name: Deploy or roll back official release
on:
  # Called automatically by the Unified release workflow right after it
  # publishes a stable release (see ADR 0013).
  workflow_call:
    inputs:
      version:
        description: Exact published release tag
        required: true
        type: string
      rollback:
        description: Allow a release older than the latest published one
        required: false
        default: false
        type: boolean
  # Manual path: redeploy the latest release or roll back to an older one.
  workflow_dispatch:
    inputs:
      version:
        description: Exact published release tag (also used for rollback)
        required: true
        type: string
      rollback:
        description: Roll back to a release older than the latest published one
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  deployments: write
concurrency:
  group: openfund-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      GITHUB_ENVIRONMENT: production
      GH_TOKEN: ${{ github.token }}
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RENDER_BACKSTAGE_SERVICE_ID: ${{ vars.RENDER_BACKSTAGE_SERVICE_ID }}
      RELEASE_BACKSTAGE_URL: ${{ vars.RELEASE_BACKSTAGE_URL }}
      RELEASE_PUBLIC_URL: ${{ vars.RELEASE_PUBLIC_URL }}
      RELEASE_CMS_URL: ${{ vars.RELEASE_CMS_URL }}
      RELEASE_TAG: ${{ inputs.version }}
      RELEASE_ROLLBACK: ${{ inputs.rollback && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Deploy exact approved SHA and verify runtime identity
        run: node scripts/release/deploy.mjs "$RELEASE_TAG"
      # Live SIWE authentication gate (additive; existing identity and CMS
      # gates in deploy.mjs are unchanged): a generated throw-away wallet
      # completes nonce → EIP-4361 signature → verified session against the
      # deployed service for each serving domain, and a domain outside
      # ALLOWED_DOMAINS must be rejected with invalid_domain.
      # Evidence only: IRAN is deployed after GLOBAL (its workflow compares
      # against GLOBAL), so a skew here is expected until that step runs.
      - name: Release identity of every service in both regions (report)
        continue-on-error: true
        run: node scripts/release/regions-status.mjs --expect-commit "$(git rev-list -n 1 "$RELEASE_TAG" 2>/dev/null || true)"
      - name: Live SIWE authentication gate
        env:
          RELEASE_SIWE_DOMAINS: ${{ vars.RELEASE_SIWE_DOMAINS }}
        run: |
          npm --prefix apps/backend ci --omit=dev --ignore-scripts --no-audit --no-fund
          node scripts/release/live-siwe-smoke.mjs "$RELEASE_PUBLIC_URL"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: deployment-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/deployment-status.json
          retention-days: 90
