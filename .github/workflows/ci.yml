name: CI

# Pull-request validation for the Openfund monorepo.
# Jobs:
#   web       — documentation, typecheck, unit tests, production frontend build
#   backend   — Postgres service container, migrations, full backend suite
#   blueprint — render.yaml structural validation (network-free)
#   secrets   — gitleaks scan of commits
#   audit     — dependency vulnerability report (non-blocking, critical level)
#   changes   — classifies the pull request (docs | affected | full) so heavy
#               jobs are skipped only when no code, build or test input changed
#               (scripts/ci/changes.mjs; docs/development/CI.md)
#
# Deployment is NOT triggered from CI: the Render Blueprint in render.yaml is
# applied manually after review (see docs/deployment/RENDER.md). Setting the
# openfund service's autoDeployTrigger to "checksPass" would make Render
# deploy when these checks pass on main — that switch is an owner decision.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual full regression
  schedule:
    - cron: '23 3 * * *' # nightly full regression of main (catches live-dependency drift)

# Superseded PR runs are cancelled. Runs for main, schedules and manual
# dispatches are keyed by commit and never cancelled: the release flow verifies
# the exact main commit's secret-scan result (scripts/release/check-secrets.mjs).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify change (CI tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      run_gates: ${{ steps.classify.outputs.run_gates }}
      run_backend_suite: ${{ steps.classify.outputs.run_backend_suite }}
      run_presentation_matrices: ${{ steps.classify.outputs.run_presentation_matrices }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: Changed files (pull requests only; everything else is full)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
      - name: Classify
        id: classify
        env:
          CI_TIER_AFFECTED: ${{ vars.CI_TIER_AFFECTED }}
        run: node scripts/ci/changes.mjs "$RUNNER_TEMP/changed.txt"
      - name: Unit tests for CI tooling
        run: node --test scripts/ci/*.test.mjs

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web-react/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Install repository documentation tooling
        working-directory: .
        run: npm ci
      - name: Documentation language, links, images, Markdown and Mermaid
        working-directory: .
        run: npm run docs:check
      - name: Vendored DePay widget matches its generated SRI manifest
        working-directory: .
        run: node scripts/upstream/vendor-depay-widgets.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests (plans / rulebook seed / markets)
        run: |
          npm run test:plans
          npm run test:checkout
          npm run test:information
          npm run test:markets
          npm run test:depth
          npm run test:website
          npm run test:whitepaper
          npm run test:terminal
          npm run test:governance
          npm run test:i18n
          npm run test:content
          npm run test:content-registry
          npm run check:product-rules
      - name: Whitepaper CMS schema and seed validation (offline)
        working-directory: .
        run: |
          python3 -m py_compile apps/backstage/scripts/apply_schema.py
          node apps/backstage/scripts/seed_whitepaper_content.mjs --dry-run
      - name: Original Pine sources and provider regression tests
        working-directory: .
        run: npm run test:charts
      - name: Footprint core (aggregation, price compatibility, symbol mapping)
        working-directory: .
        run: npm run test:footprint
      - name: Release integrity tests
        working-directory: .
        run: npm run test:release
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: react/
          retention-days: 3

  backend:
    name: Backend (API + engine)
    needs: changes
    # A job skipped by `if` reports as passing to required status checks; it is
    # skipped ONLY for documentation-only pull requests (see scripts/ci/changes.mjs).
    if: needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfund_ci
          POSTGRES_USER: openfund_ci
          POSTGRES_PASSWORD: openfund_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfund_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_ci
      ALLOWED_DOMAINS: localhost:5173,localhost:8080,openfund-our6.onrender.com,openfi.cloud,openfund.cloud
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,https://openfi.cloud,https://openfund.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Migrations (idempotency check — run twice)
        run: |
          npm run migrate
          npm run migrate
      - name: Seed plan catalog
        run: npm run seed-plans
      # react/ is generated output and is not tracked: the server reads
      # react/index.html and react/legacy at start-up, so build before booting.
      - name: Build the frontend the server serves (react/ is not tracked)
        working-directory: .
        run: |
          npm ci --include=dev --prefix apps/web-react
          npm run build:web
      - name: Boot server (integration suites hit it on :8080)
        run: |
          # PURCHASE_PAYMENT_RECEIVER is a CI-only placeholder so the purchase
          # lifecycle is testable end-to-end; never a production address.
          # ADMIN_API_TOKEN (CI-only value) enables the admin suite.
          # CSP_EXTRA_CONNECT: the test frontend fetches the local Directus
          # origin (http), which the strict CSP connect-src must allow.
          SIM_TEST_MODE=1 ADMIN_API_TOKEN=ci-admin-token-4f2a CSP_EXTRA_CONNECT=http://localhost:8055 PURCHASE_PAYMENT_RECEIVER=0x000000000000000000000000000000000000c1a1 npm start &
          for i in $(seq 1 30); do
            sleep 1
            if curl -fsS http://localhost:8080/health > /dev/null; then echo "health OK"; break; fi
          done
          curl -fsS http://localhost:8080/health > /dev/null || { echo "health check failed"; exit 1; }
      - name: Test suite (including permanent trial risk and five-category fixtures)
        if: needs.changes.outputs.run_backend_suite == 'true'
        env:
          TEST_BACKEND_URL: http://localhost:8080
          TEST_PRODUCTION_SIWE_ORIGINS: '1'
          ADMIN_API_TOKEN: ci-admin-token-4f2a
        run: npm run test:all
      - name: Regional runtime and synchronization suites (ADR 0032/0033, disposable databases)
        if: needs.changes.outputs.run_backend_suite == 'true'
        env:
          PGPASSWORD: openfund_ci
          REGION_TEST_IRAN_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_region_iran_test
          REGION_TEST_GLOBAL_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_region_global_test
          REGION_SYNC_TEST_IRAN_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_rsync_iran_test
          REGION_SYNC_TEST_GLOBAL_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_rsync_global_test
        run: |
          for d in openfund_region_iran_test openfund_region_global_test openfund_rsync_iran_test openfund_rsync_global_test; do
            psql -h localhost -U openfund_ci -d openfund_ci -c "CREATE DATABASE $d"
          done
          DATABASE_URL="$REGION_TEST_IRAN_URL" OPENFUND_REGION=IRAN npm run migrate
          DATABASE_URL="$REGION_TEST_GLOBAL_URL" npm run migrate
          DATABASE_URL="$REGION_SYNC_TEST_IRAN_URL" OPENFUND_REGION=IRAN npm run migrate
          DATABASE_URL="$REGION_SYNC_TEST_GLOBAL_URL" npm run migrate
          npm run test:region
          # ADR 0033: two real regions, signed sync, fault injection, 120-day backlog, handoff
          npm run test:regional-sync
          node --test ../../scripts/liara/test/provision.test.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test tools
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser integration (controlled CMS/Gains and generated test wallets)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: |
          npm run test:browser:audit || {
            echo "::warning::Browser audit failed once; retrying with fresh wallets"
            npm run test:browser:audit
          }
      - name: Terminal wallet, order lifecycle and all-tab acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:completion
      - name: Terminal SL/TP, order review, position overlay and per-wallet chart workspace
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:risk
      - name: Certificate issuance, exports and public verification
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:certificates
      - name: Footprint feature flag off (no footprint request, no style entry)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          FOOTPRINT_EXPECT_OFF: '1'
        run: npm run test:browser:footprint
      - name: Terminal layout, bilingual geometry and overflow acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: |
          npm run test:browser:layout
          TEST_LAYOUT_AUTH=1 npm run test:browser:layout
      - name: Locale availability, wallet header and native theme matrix (sharded)
        if: needs.changes.outputs.run_presentation_matrices == 'true'
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        # The matrix is read-only and independent per locale/theme/width, so it
        # runs as concurrent shards (previously one ~16 min sequential run).
        # No retries: every shard runs once and any failing shard fails the job.
        run: |
          node scripts/ci/run-parallel.mjs --timeout-minutes 30 \
            polish-1/4 POLISH_PART=matrix POLISH_SHARD=1/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-1 node e2e/test-ui-polish.cjs +++ \
            polish-2/4 POLISH_PART=matrix POLISH_SHARD=2/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-2 node e2e/test-ui-polish.cjs +++ \
            polish-3/4 POLISH_PART=matrix POLISH_SHARD=3/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-3 node e2e/test-ui-polish.cjs +++ \
            polish-4/4 POLISH_PART=matrix POLISH_SHARD=4/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-4 node e2e/test-ui-polish.cjs +++ \
            polish-tail POLISH_PART=tail POLISH_OUTPUT=output/playwright/ui-polish/tail AUTO_DARK_OUTPUT=output/playwright/auto-dark node e2e/test-ui-polish.cjs
          npm run test:browser:website
      - name: Persian landing viewport, motion and navigation acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: node e2e/test-landing-motion.cjs
      - name: Challenge purchase, invoice and withdrawal browser lifecycle
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:purchase
      - name: DePay checkout browser acceptance (stub widget, mock chain, signed callbacks)
        working-directory: .
        run: npm run test:browser:depay
      - name: Chart interaction and indicator browser regression
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:charts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-audit
          path: |
            output/playwright/audit/
            output/playwright/ui-polish/
            output/playwright/auto-dark/
            output/playwright/website-refresh/
            output/playwright/landing-motion/
            output/playwright/purchase-flow/
            output/playwright/depay-checkout/
            output/playwright/chart-indicators/
            output/playwright/terminal-layout/
            output/playwright/terminal-layout-authenticated/
            output/playwright/terminal-completion/
          retention-days: 3

  blueprint:
    name: Render Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Structural validation (offline)
        run: npm run validate:blueprint
      - name: Render CLI validation (optional — requires RENDER_API_TOKEN)
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          if [ -z "$RENDER_API_TOKEN" ]; then
            echo "RENDER_API_TOKEN not set — skipping authenticated blueprint validation."
            echo "Add the secret to enable full validation (see docs/deployment/RENDER.md)."
          else
            curl -fsSL https://github.com/render-oss/cli/releases/latest/download/render-linux-amd64 -o /usr/local/bin/render
            chmod +x /usr/local/bin/render
            render blueprint validate ./render.yaml
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: write lets gitleaks-action post its findings as a PR
    # comment; without it the job logs a "Resource not accessible by
    # integration" HttpError even when the scan itself succeeds.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9 (third-party: pinned to a commit; Dependabot proposes updates)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          # 8.24.x does not apply path allowlists to --log-opts scans, which
          # re-flags the documented public SDK constants in react/assets/
          # whenever a rebuild renames those chunks. 8.30.1 honors the config.
          GITLEAKS_VERSION: 8.30.1

  audit:
    name: Dependency audit (report)
    runs-on: ubuntu-latest
    continue-on-error: true # report-only gate; triage in the job log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - name: repository tooling audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=critical || echo "::warning::critical advisories in repository tooling — see log"
      - name: web-react audit
        run: npm --prefix apps/web-react audit --audit-level=critical || echo "::warning::critical advisories in apps/web-react — see log"
      - name: backend audit
        run: npm --prefix apps/backend audit --audit-level=critical || echo "::warning::critical advisories in apps/backend — see log"

  desktop-contract:
    name: Desktop IPC policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      - run: node --test apps/open-trade/tests/policy.test.mjs
