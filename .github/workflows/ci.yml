name: CI

# Pull-request validation for the Openfund monorepo.
# Jobs:
#   web       — documentation, typecheck, unit tests, production frontend build
#   backend   — Postgres service container, migrations, full backend suite
#   database-roles — OF-2026-11-12: Directus on its own PostgreSQL role, the
#               privilege policy, CMS bootstrap and the isolation regression suite
#   responsive-matrix — built web app across 10 widths x 5 locales x 2 themes:
#               overflow, clipped controls, drawer side/closing, console errors
#               and axe (e2e/test-responsive-matrix.cjs, three shards)
#   blueprint — render.yaml structural validation (network-free)
#   secrets   — gitleaks scan of commits
#   audit     — dependency vulnerability report (non-blocking, critical level)
#   audit-production — blocking: high/critical advisories in backend and
#               Backstage production dependencies
#   changes   — classifies the pull request (docs | affected | full) so heavy
#               jobs are skipped only when no code, build or test input changed
#               (scripts/ci/changes.mjs; docs/development/CI.md)
#
# Deployment is NOT triggered from CI: the Render Blueprint in render.yaml is
# applied manually after review (see docs/deployment/RENDER.md). Setting the
# openfund service's autoDeployTrigger to "checksPass" would make Render
# deploy when these checks pass on main — that switch is an owner decision.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # manual full regression
  schedule:
    - cron: '23 3 * * *' # nightly full regression of main (catches live-dependency drift)

# Superseded PR runs are cancelled. Runs for main, schedules and manual
# dispatches are keyed by commit and never cancelled: the release flow verifies
# the exact main commit's secret-scan result (scripts/release/check-secrets.mjs).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Classify change (CI tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      tier: ${{ steps.classify.outputs.tier }}
      run_gates: ${{ steps.classify.outputs.run_gates }}
      run_backend_suite: ${{ steps.classify.outputs.run_backend_suite }}
      run_presentation_matrices: ${{ steps.classify.outputs.run_presentation_matrices }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Changed files (pull requests only; everything else is full)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
      - name: Classify
        id: classify
        env:
          CI_TIER_AFFECTED: ${{ vars.CI_TIER_AFFECTED }}
        run: node scripts/ci/changes.mjs "$RUNNER_TEMP/changed.txt"
      - name: Unit tests for CI tooling
        run: node --test scripts/ci/*.test.mjs

  web:
    name: Web (React + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # read-only: lists the pull request's changed files for the docs-impact gate
      pull-requests: read
    defaults:
      run:
        working-directory: apps/web-react
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/web-react/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Install repository documentation tooling
        working-directory: .
        run: npm ci
      - name: Documentation gates (README structure, retired registry, fonts) plus language, links, images, Markdown and Mermaid
        working-directory: .
        run: npm run docs:check
      - name: Docs impact — every merge keeps the README and docs current (pull requests; docs/development/README_STRUCTURE.md)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
          node scripts/docs/check-docs-impact.mjs "$RUNNER_TEMP/changed.txt"
      - name: Backstage build and access control
        working-directory: .
        run: |
          npm --prefix apps/backstage ci
          npm --prefix apps/backstage run build
          npm --prefix apps/backstage test
      - name: Vendored DePay widget matches its generated SRI manifest
        working-directory: .
        run: node scripts/upstream/vendor-depay-widgets.mjs
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Unit tests (plans / rulebook seed / markets)
        run: |
          npm run test:plans
          npm run test:checkout
          npm run test:information
          npm run test:markets
          npm run test:depth
          npm run test:website
          npm run test:typography
          npm run test:whitepaper
          npm run test:terminal
          npm run test:governance
          npm run test:i18n
          npm run test:content
          npm run test:content-registry
          npm run check:product-rules
      - name: Whitepaper CMS schema and seed validation (offline)
        working-directory: .
        run: |
          python3 -m py_compile apps/backstage/scripts/apply_schema.py
          node apps/backstage/scripts/seed_whitepaper_content.mjs --dry-run
      - name: Original Pine sources and provider regression tests
        working-directory: .
        run: npm run test:charts
      - name: Footprint core (aggregation, price compatibility, symbol mapping)
        working-directory: .
        run: npm run test:footprint
      - name: Release integrity tests
        working-directory: .
        run: npm run test:release
      - name: Production build
        run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-build
          path: react/
          retention-days: 3

  backend:
    name: Backend (API + engine)
    needs: changes
    # A job skipped by `if` reports as passing to required status checks; it is
    # skipped ONLY for documentation-only pull requests (see scripts/ci/changes.mjs).
    if: needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfund_ci
          POSTGRES_USER: openfund_ci
          POSTGRES_PASSWORD: openfund_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openfund_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_ci
      ALLOWED_DOMAINS: localhost:5173,localhost:8080,openfund-our6.onrender.com,openfi.cloud,openfund.cloud
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080,https://openfi.cloud,https://openfund.cloud
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: apps/backend/package-lock.json
      - name: Install (lockfile integrity)
        run: npm ci
      - name: Migrations (idempotency check — run twice)
        run: |
          npm run migrate
          npm run migrate
      - name: Seed plan catalog
        run: npm run seed-plans
      # react/ is generated output and is not tracked: the server reads
      # react/index.html and react/legacy at start-up, so build before booting.
      - name: Build the frontend the server serves (react/ is not tracked)
        working-directory: .
        run: |
          npm ci --include=dev --prefix apps/web-react
          npm run build:web
      - name: Boot server (integration suites hit it on :8080)
        run: |
          # PURCHASE_PAYMENT_RECEIVER is a CI-only placeholder so the purchase
          # lifecycle is testable end-to-end; never a production address.
          # ADMIN_API_TOKEN (CI-only value) enables the admin suite.
          # CSP_EXTRA_CONNECT: the test frontend fetches the local Directus
          # origin (http), which the strict CSP connect-src must allow.
          SIM_TEST_MODE=1 ADMIN_API_TOKEN=ci-admin-token-4f2a CSP_EXTRA_CONNECT=http://localhost:8055 PURCHASE_PAYMENT_RECEIVER=0x000000000000000000000000000000000000c1a1 npm start &
          for _ in $(seq 1 30); do
            sleep 1
            if curl -fsS http://localhost:8080/health > /dev/null; then echo "health OK"; break; fi
          done
          curl -fsS http://localhost:8080/health > /dev/null || { echo "health check failed"; exit 1; }
      - name: Test suite (including permanent trial risk and five-category fixtures)
        if: needs.changes.outputs.run_backend_suite == 'true'
        env:
          TEST_BACKEND_URL: http://localhost:8080
          TEST_PRODUCTION_SIWE_ORIGINS: '1'
          ADMIN_API_TOKEN: ci-admin-token-4f2a
        run: npm run test:all
      - name: Regional runtime and synchronization suites (ADR 0032/0033, disposable databases)
        if: needs.changes.outputs.run_backend_suite == 'true'
        env:
          PGPASSWORD: openfund_ci
          REGION_TEST_IRAN_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_region_iran_test
          REGION_TEST_GLOBAL_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_region_global_test
          REGION_SYNC_TEST_IRAN_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_rsync_iran_test
          REGION_SYNC_TEST_GLOBAL_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_rsync_global_test
        run: |
          for d in openfund_region_iran_test openfund_region_global_test openfund_rsync_iran_test openfund_rsync_global_test; do
            psql -h localhost -U openfund_ci -d openfund_ci -c "CREATE DATABASE $d"
          done
          DATABASE_URL="$REGION_TEST_IRAN_URL" OPENFUND_REGION=IRAN npm run migrate
          DATABASE_URL="$REGION_TEST_GLOBAL_URL" npm run migrate
          DATABASE_URL="$REGION_SYNC_TEST_IRAN_URL" OPENFUND_REGION=IRAN npm run migrate
          DATABASE_URL="$REGION_SYNC_TEST_GLOBAL_URL" npm run migrate
          npm run test:region
          # ADR 0033: two real regions, signed sync, fault injection, 120-day backlog, handoff
          npm run test:regional-sync
          node --test ../../scripts/liara/test/provision.test.mjs ../../scripts/liara/test/check-infra.test.mjs
          # ADR 0042: manifest, workflows and docs agree on every Liara/GitHub identifier
          node ../../scripts/liara/check-infra.mjs
          # ADR 0043: Cloudflare rules agree with the application's alias redirect
          node --test ../../scripts/cloudflare/test/policy.test.mjs ../../scripts/cloudflare/test/check-live.test.mjs ../../scripts/ops/test/geo-redirect-readiness.test.mjs
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser test tools
        working-directory: .
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser integration (controlled CMS/Gains and generated test wallets)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: |
          npm run test:browser:audit || {
            echo "::warning::Browser audit failed once; retrying with fresh wallets"
            npm run test:browser:audit
          }
      - name: Terminal wallet, order lifecycle and all-tab acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:completion
      - name: Terminal SL/TP, order review, position overlay and per-wallet chart workspace
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:risk
      - name: Perpetual Gains read-only readiness (one session, wallet change, freshness states, five locales)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:perpetual
      - name: Perpetual UI lifecycle in an isolated simulation (test-only adapter, no transactions)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:perpetual-simulation
      - name: Certificate issuance, exports and public verification
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:certificates
      - name: Contact page layout, team selection, submission, RTL/LTR and reduced motion
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/contact
        run: npm run test:browser:contact
      - name: Footprint feature flag off (no footprint request, no style entry)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          FOOTPRINT_EXPECT_OFF: '1'
        run: npm run test:browser:footprint
      - name: Language selector (globe, listbox keyboard, bottom sheet, RTL/LTR, reduced motion)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/language-select
        run: npm run test:browser:language-select
      - name: Wallet showcase motion, placement, demo labels, RTL/LTR and reduced motion
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/wallet-showcase
        run: npm run test:browser:wallet-showcase
      - name: Footer alien-trader banner (placement, lazy, live gating, mobile crop, light band, reduced motion)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/footer-banner
        run: npm run test:browser:footer-banner
      - name: Trading objectives page (five locales, themes, catalog numbers, plan tabs, rulebook links, reduced motion)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/trading-objectives
        run: npm run test:browser:trading-objectives
      - name: Migration to Openfund page (five locales, themes, comparison, request state, reduced motion, challenges card)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/migration
        run: npm run test:browser:migration
      - name: Premium League page (five locales, themes, real registration count, live gating, reduced motion, terms)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/tournament
        run: npm run test:browser:tournament
      - name: Terminal Funding and Details tabs (tab order and keys, live Gains values, honest history, account limits, phone views)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/terminal-funding
        run: npm run test:browser:terminal-funding
      - name: Home hero trader journey (stages, flip, funded metal, mobile, reduced motion)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/hero-journey
        run: npm run test:browser:hero-journey
      - name: Header mega menu (hover intent, keyboard, panel, drawer accordion, terminal tiles)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/mega-menu
        run: npm run test:browser:mega-menu
      - name: Developer documentation page (sections, sources, search, index, locales)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/developers
        run: npm run test:browser:developers
      - name: Governance council chamber (vote sequence, rules, pause, reduced motion, 5 locales)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/council-chamber
        run: npm run test:browser:council-chamber
      - name: Checkout model banners and conditions (server rules x size, motion gating, RTL/LTR widths)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/checkout-rules
        run: npm run test:browser:checkout-rules
      - name: Applications page motion, step tabs, real captures, RTL/LTR and reduced motion
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/applications
        run: npm run test:browser:applications
      - name: Market Heatmap and Trade Radar (fixed fixtures and clock; tiles, details, tape, empty states, eight widths)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/heatmap-radar
        run: npm run test:browser:heatmap-radar
      # Real Hyperliquid feed through the backend cache. Informational only:
      # it depends on the network and live markets, so it never fails the job.
      - name: Market Heatmap and Trade Radar real-feed integration (not required)
        continue-on-error: true
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:heatmap-radar:live
      - name: Terminal layout, bilingual geometry and overflow acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: |
          npm run test:browser:layout
          TEST_LAYOUT_AUTH=1 npm run test:browser:layout
      - name: Locale availability, wallet header and native theme matrix (sharded)
        if: needs.changes.outputs.run_presentation_matrices == 'true'
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        # The matrix is read-only and independent per locale/theme/width, so it
        # runs as concurrent shards (previously one ~16 min sequential run).
        # No retries: every shard runs once and any failing shard fails the job.
        run: |
          node scripts/ci/run-parallel.mjs --timeout-minutes 30 \
            polish-1/4 POLISH_PART=matrix POLISH_SHARD=1/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-1 node e2e/test-ui-polish.cjs +++ \
            polish-2/4 POLISH_PART=matrix POLISH_SHARD=2/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-2 node e2e/test-ui-polish.cjs +++ \
            polish-3/4 POLISH_PART=matrix POLISH_SHARD=3/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-3 node e2e/test-ui-polish.cjs +++ \
            polish-4/4 POLISH_PART=matrix POLISH_SHARD=4/4 POLISH_OUTPUT=output/playwright/ui-polish/shard-4 node e2e/test-ui-polish.cjs +++ \
            polish-tail POLISH_PART=tail POLISH_OUTPUT=output/playwright/ui-polish/tail AUTO_DARK_OUTPUT=output/playwright/auto-dark node e2e/test-ui-polish.cjs
          npm run test:browser:website
      - name: Direction-aware arrows on every public route in five locales
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:arrows
      - name: Persian landing viewport, motion and navigation acceptance
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: node e2e/test-landing-motion.cjs
      - name: Challenge purchase, invoice and withdrawal browser lifecycle
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          TEST_BACKEND_URL: http://localhost:8080
        run: npm run test:browser:purchase
      - name: Purchase-test readiness probe against a local boot (throw-away DePay test keys, no money)
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        run: node e2e/test-purchase-readiness.mjs
      - name: Site framing policy (frame-ancestors / X-Frame-Options) against a local boot
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        run: node e2e/test-frame-ancestors.mjs
      - name: Backstage owner browser acceptance
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        env:
          TEST_BACKEND_URL: http://localhost:8080
          ADMIN_API_TOKEN: ci-admin-token-4f2a
        run: node e2e/test-backstage.mjs
      - name: Dastkhat typography (rendered font, font requests and CSP on site, terminal iframe and Backstage)
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/typography
        run: npm run test:browser:typography
      - name: Backstage operations sections browser acceptance (fa/en)
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        env:
          TEST_BACKEND_URL: http://localhost:8080
          ADMIN_API_TOKEN: ci-admin-token-4f2a
        run: node e2e/test-backstage-operations.mjs
      - name: Coupon campaign link, re-pricing and zero-payment checkout browser acceptance (fa/en)
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
          ADMIN_API_TOKEN: ci-admin-token-4f2a
          OUTPUT_DIR: output/playwright/coupon-checkout
        run: node e2e/test-coupon-checkout.cjs
      - name: Controlled challenge checkout and simulated payout browser acceptance
        if: needs.changes.outputs.run_backend_suite == 'true'
        working-directory: .
        env:
          PGPASSWORD: openfund_ci
          DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_controlled_browser_test
          TEST_FRONTEND_URL: http://localhost:8296
          ALLOWED_DOMAINS: localhost:8296
          CORS_ORIGINS: http://localhost:8296
          ADMIN_API_TOKEN: ci-admin-token-4f2a
          SIM_TEST_MODE: '1'
          # Start the test server's conduct clock inside the funded pre-close
          # window (21:45–22:00 UTC in winter). The suite pins its own times, so
          # this proves it no longer depends on when CI runs.
          SIM_TEST_CLOCK: '2026-11-18T21:50:00Z'
          OPENFUND_ROLES: http
          PORT: '8296'
        run: |
          createdb -h localhost -U openfund_ci openfund_controlled_browser_test
          npm run build:backend
          npm --prefix apps/backend run seed-plans
          node apps/backend/server.js > /tmp/openfund-controlled-browser.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS "$TEST_FRONTEND_URL/health" > /dev/null; then break; fi
            sleep 1
          done
          node e2e/test-controlled-challenges.cjs || { cat /tmp/openfund-controlled-browser.log; exit 1; }
      - name: Journey acceptance (session expiry, loss breaches, trading days, inbox, localized checkout)
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:journeys
      - name: Browser session security (cookie isolation, wallet switch, logout, hostile origin)
        working-directory: .
        env:
          BASE_URL: http://localhost:8080
        run: npm run test:browser:security
      - name: DePay checkout browser acceptance (stub widget, mock chain, signed callbacks)
        working-directory: .
        run: npm run test:browser:depay
      - name: Chart interaction and indicator browser regression
        working-directory: .
        env:
          TEST_FRONTEND_URL: http://localhost:8080
        run: npm run test:browser:charts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-audit
          path: |
            output/playwright/audit/
            output/playwright/ui-polish/
            output/playwright/auto-dark/
            output/playwright/website-refresh/
            output/playwright/landing-motion/
            output/playwright/purchase-flow/
            output/playwright/depay-checkout/
            output/playwright/chart-indicators/
            output/playwright/terminal-layout/
            output/playwright/terminal-layout-authenticated/
            output/playwright/terminal-completion/
            output/playwright/wallet-showcase/
            output/playwright/footer-banner/
            output/playwright/trading-objectives/
            output/playwright/migration/
            output/playwright/tournament/
            output/playwright/terminal-funding/
            output/playwright/hero-journey/
            output/playwright/mega-menu/
            output/playwright/developers/
            output/playwright/council-chamber/
            output/playwright/checkout-rules/
            output/playwright/applications/
            output/playwright/heatmap-radar/
            output/playwright/language-select/
            output/playwright/contact/
          retention-days: 3

  responsive-matrix:
    name: Responsive matrix (shard ${{ matrix.shard }}/3)
    needs: changes
    # Skipped (and reported as passing) only when no web or CMS input changed
    # under the affected tier, or for documentation-only pull requests.
    if: needs.changes.outputs.run_presentation_matrices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-react/package-lock.json
      - name: Install (lockfile integrity)
        run: |
          npm ci
          npm --prefix apps/web-react ci
      # The suite serves react/ itself (stub runtime-config.js, 503 backend and CMS)
      - name: Build the web application
        run: npm run build:web
      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Widths, locales, themes, drawer, console and axe matrix
        env:
          MATRIX_SHARD: ${{ matrix.shard }}/3
          MATRIX_CAPTURE: '1'
          MATRIX_OUTPUT: output/playwright/responsive-matrix
        run: npm run test:browser:responsive-matrix
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: responsive-matrix-${{ matrix.shard }}
          path: output/playwright/responsive-matrix/
          retention-days: 7

  campaigns:
    name: Campaigns and announcements (Directus + browser)
    needs: changes
    if: needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfund_campaigns_ci
          POSTGRES_USER: openfund_ci
          POSTGRES_PASSWORD: openfund_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openfund_ci -d openfund_campaigns_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_campaigns_ci
      DIRECTUS_URL: http://127.0.0.1:8055
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-react/package-lock.json
            apps/backend/package-lock.json
      - name: Install, migrate and build the site
        run: |
          npm ci --include=dev
          npm ci --include=dev --prefix apps/web-react
          npm ci --prefix apps/backend
          npm --prefix apps/backend run migrate
          npm --prefix apps/backend run seed-plans
          npm run build:web
          npx --no-install playwright install --with-deps chromium
      - name: Directus 11.17.4, bootstrap (twice) and the Backstage editor role
        run: |
          DIRECTUS_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          export DIRECTUS_ADMIN_EMAIL=campaigns-ci@example.com DIRECTUS_ADMIN_PASSWORD
          docker run --rm -d --name openfund-campaigns-cms --network host \
            -e DB_CLIENT=pg -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=openfund_campaigns_ci -e DB_USER=openfund_ci -e DB_PASSWORD=openfund_ci \
            -e KEY="$(openssl rand -hex 16)" -e SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL="$DIRECTUS_ADMIN_EMAIL" -e ADMIN_PASSWORD="$DIRECTUS_ADMIN_PASSWORD" \
            -e CORS_ENABLED=true -e CORS_ORIGIN=true directus/directus:11.17.4
          for _ in $(seq 1 90); do curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null && break; sleep 1; done
          bash apps/backstage/scripts/bootstrap-cms.sh
          bash apps/backstage/scripts/bootstrap-cms.sh
          python3 apps/backstage/scripts/register_backstage_editor.py
          # a per-run token for a user on the restricted editor role (never stored)
          EDITOR_TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$EDITOR_TOKEN"
          ADMIN=$(curl -fsS -X POST "$DIRECTUS_URL/auth/login" -H 'content-type: application/json' \
            -d "{\"email\":\"$DIRECTUS_ADMIN_EMAIL\",\"password\":\"$DIRECTUS_ADMIN_PASSWORD\"}" | node -pe 'JSON.parse(require("fs").readFileSync(0)).data.access_token')
          ROLE=$(curl -fsS "$DIRECTUS_URL/roles?fields=id,name&limit=-1" -H "Authorization: Bearer $ADMIN" \
            | node -pe 'JSON.parse(require("fs").readFileSync(0)).data.find(r => r.name === "Backstage Content Editor").id')
          curl -fsS -o /dev/null -X POST "$DIRECTUS_URL/users" -H "Authorization: Bearer $ADMIN" -H 'content-type: application/json' \
            -d "{\"email\":\"backstage-editor@example.com\",\"role\":\"$ROLE\",\"token\":\"$EDITOR_TOKEN\",\"status\":\"active\"}"
          echo "BACKSTAGE_DIRECTUS_TOKEN=$EDITOR_TOKEN" >> "$GITHUB_ENV"
      - name: Boot the site against Directus
        run: |
          ADMIN_API_TOKEN="$(openssl rand -hex 24)"
          echo "::add-mask::$ADMIN_API_TOKEN"
          echo "ADMIN_API_TOKEN=$ADMIN_API_TOKEN" >> "$GITHUB_ENV"
          cd apps/backend
          PORT=8080 SIM_TEST_MODE=1 ADMIN_API_TOKEN="$ADMIN_API_TOKEN" CMS_PUBLIC_URL="$DIRECTUS_URL" CSP_EXTRA_CONNECT="$DIRECTUS_URL" \
            ALLOWED_DOMAINS=localhost:8080 CORS_ORIGINS=http://localhost:8080 npm start > /tmp/openfund-campaigns.log 2>&1 &
          for _ in $(seq 1 40); do curl -fsS http://localhost:8080/health >/dev/null && break; sleep 1; done
      - name: Campaign and announcement browser acceptance (fa/en, RTL/LTR, mobile)
        env:
          TEST_BACKEND_URL: http://localhost:8080
          OUTPUT_DIR: output/playwright/campaigns
        run: node e2e/test-campaigns.mjs || { tail -60 /tmp/openfund-campaigns.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: campaign-evidence
          path: output/playwright/campaigns/
          retention-days: 7
      - name: Stop Directus
        if: always()
        run: docker stop openfund-campaigns-cms >/dev/null 2>&1 || true

  database-roles:
    name: CMS security (OF-2026-11-12 roles, OF-2026-11-11 Directus controls)
    needs: changes
    if: needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # A non-superuser owner with CREATEROLE, as on Render Postgres. Every
      # value below is a disposable CI value, never a deployed credential.
      OWNER_DATABASE_URL: postgres://of_owner_ci:of_owner_ci@localhost:5432/openfund_roles_ci
      CMS_DATABASE_URL: postgres://openfund_directus:openfund_directus_ci@localhost:5432/openfund_roles_ci
      RUNTIME_DATABASE_URL: postgres://openfund_runtime:openfund_runtime_ci@localhost:5432/openfund_roles_ci
      DIRECTUS_URL: http://127.0.0.1:8055
      DB_ROLES_REQUIRE_DATABASE: '1'
      DB_ROLES_REQUIRE_DIRECTUS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            apps/web-react/package-lock.json
            apps/backend/package-lock.json
      - name: Install
        run: |
          npm ci --ignore-scripts
          npm ci --prefix apps/backend
          npm ci --include=dev --prefix apps/web-react
      - name: Render-like owner role and migrations
        env:
          PGPASSWORD: postgres_ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE ROLE of_owner_ci LOGIN PASSWORD 'of_owner_ci' CREATEROLE" -c "CREATE DATABASE openfund_roles_ci OWNER of_owner_ci"
          DATABASE_URL="$OWNER_DATABASE_URL" npm --prefix apps/backend run migrate
          DATABASE_URL="$OWNER_DATABASE_URL" npm --prefix apps/backend run seed-plans
      - name: First CMS bootstrap on the owner credential (what production already has)
        # Attaching Directus relation metadata to backend foreign keys makes
        # Directus 11 rewrite the constraint, which needs table ownership. A
        # new database therefore gets its first bootstrap with the owner
        # credential; every later bootstrap runs on the Directus role
        # (docs/security/DATABASE_ROLES.md).
        run: |
          DIRECTUS_ADMIN_EMAIL=roles-ci@example.com
          DIRECTUS_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          export DIRECTUS_ADMIN_EMAIL DIRECTUS_ADMIN_PASSWORD
          echo "::add-mask::$DIRECTUS_ADMIN_PASSWORD"
          DIRECTUS_KEY="$(openssl rand -hex 16)"
          DIRECTUS_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$DIRECTUS_SECRET"
          {
            echo "DIRECTUS_ADMIN_EMAIL=$DIRECTUS_ADMIN_EMAIL"
            echo "DIRECTUS_ADMIN_PASSWORD=$DIRECTUS_ADMIN_PASSWORD"
            echo "DIRECTUS_KEY=$DIRECTUS_KEY"
            echo "DIRECTUS_SECRET=$DIRECTUS_SECRET"
          } >> "$GITHUB_ENV"
          docker run --rm -d --name openfund-roles-cms --network host \
            -e DB_CLIENT=pg -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_DATABASE=openfund_roles_ci \
            -e DB_USER=of_owner_ci -e DB_PASSWORD=of_owner_ci \
            -e KEY="$DIRECTUS_KEY" -e SECRET="$DIRECTUS_SECRET" \
            -e ADMIN_EMAIL="$DIRECTUS_ADMIN_EMAIL" -e ADMIN_PASSWORD="$DIRECTUS_ADMIN_PASSWORD" \
            -e WEBSOCKETS_ENABLED=false directus/directus:11.17.4
          for _ in $(seq 1 90); do curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null && break; sleep 1; done
          bash apps/backstage/scripts/bootstrap-cms.sh
          docker stop openfund-roles-cms
      - name: Role policy (applied twice)
        env:
          CMS_DB_PASSWORD: openfund_directus_ci
          RUNTIME_DB_PASSWORD: openfund_runtime_ci
        run: |
          node scripts/ops/db-roles.mjs plan > /dev/null
          node scripts/ops/db-roles.mjs apply
          node scripts/ops/db-roles.mjs apply
      - name: Directus 11.17.4 on the openfund_directus role with the render.yaml settings, CMS bootstrap again and editor role
        run: |
          # the literal openfund-cms environment from render.yaml (OF-2026-11-11 controls included)
          node scripts/ops/directus-env.mjs > "$RUNNER_TEMP/directus.env"
          docker run --rm -d --name openfund-roles-cms --network host --env-file "$RUNNER_TEMP/directus.env" \
            -e PORT=8055 -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_DATABASE=openfund_roles_ci \
            -e DB_USER=openfund_directus -e DB_PASSWORD=openfund_directus_ci \
            -e KEY="$DIRECTUS_KEY" -e SECRET="$DIRECTUS_SECRET" \
            directus/directus:11.17.4
          for _ in $(seq 1 90); do curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null && break; sleep 1; done
          bash apps/backstage/scripts/bootstrap-cms.sh
          python3 apps/backstage/scripts/register_backstage_editor.py
          node scripts/ops/db-roles.mjs apply
      - name: CMS bootstrap regression across a Directus restart
        env:
          DATABASE_URL: ${{ env.OWNER_DATABASE_URL }}
        run: |
          node scripts/release/test-cms-bootstrap.mjs before
          docker restart openfund-roles-cms
          for _ in $(seq 1 90); do curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null && break; sleep 1; done
          bash apps/backstage/scripts/bootstrap-cms.sh
          node scripts/release/test-cms-bootstrap.mjs after
      - name: Privilege isolation regression suite
        run: node --test --test-concurrency=1 scripts/ops/test/db-roles.test.mjs
      - name: Directus 11.x compensating controls (OF-2026-11-11)
        env:
          DIRECTUS_HARDENING_REQUIRE: '1'
        run: node --test --test-concurrency=1 scripts/ops/test/directus-hardening.test.mjs
      - name: Read-only drift check
        run: node scripts/ops/db-roles.mjs verify
      - name: Directus logs
        if: failure()
        run: docker logs openfund-roles-cms --tail 80 2>&1 || true
      - name: Stop Directus
        if: always()
        run: docker stop openfund-roles-cms >/dev/null 2>&1 || true

  blueprint:
    name: Render Blueprint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root tooling
        run: npm ci
      - name: Structural validation (offline)
        run: npm run validate:blueprint
      - name: Render CLI validation (optional — requires RENDER_API_TOKEN)
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
        run: |
          if [ -z "$RENDER_API_TOKEN" ]; then
            echo "RENDER_API_TOKEN not set — skipping authenticated blueprint validation."
            echo "Add the secret to enable full validation (see docs/deployment/RENDER.md)."
          else
            curl -fsSL https://github.com/render-oss/cli/releases/latest/download/render-linux-amd64 -o /usr/local/bin/render
            chmod +x /usr/local/bin/render
            render blueprint validate ./render.yaml
          fi

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # pull-requests: write lets gitleaks-action post its findings as a PR
    # comment; without it the job logs a "Resource not accessible by
    # integration" HttpError even when the scan itself succeeds.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9 (third-party: pinned to a commit; Dependabot proposes updates)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          # 8.24.x does not apply path allowlists to --log-opts scans, which
          # re-flags the documented public SDK constants in react/assets/
          # whenever a rebuild renames those chunks. 8.30.1 honors the config.
          GITLEAKS_VERSION: 8.30.1

  audit:
    name: Dependency audit (report)
    runs-on: ubuntu-latest
    continue-on-error: true # report-only gate; triage in the job log
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: repository tooling audit
        run: npm audit --registry=https://registry.npmjs.org --audit-level=critical || echo "::warning::critical advisories in repository tooling — see log"
      - name: web-react audit
        run: npm --prefix apps/web-react audit --audit-level=critical || echo "::warning::critical advisories in apps/web-react — see log"
      - name: backend audit
        run: npm --prefix apps/backend audit --audit-level=critical || echo "::warning::critical advisories in apps/backend — see log"

  # Blocking gate for the server-side PRODUCTION dependency trees (security
  # audit 2026-11): a high or critical advisory in a runtime dependency of
  # the backend or Backstage fails CI. Dev dependencies and the browser and
  # desktop bundles stay in the report-only job above until their open
  # findings (docs/security/SECURITY-REMEDIATION-PLAN.md) are resolved.
  audit-production:
    name: Production dependency gate (server)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: backend production dependencies
        run: npm --prefix apps/backend audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: backstage production dependencies
        run: npm --prefix apps/backstage audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org

  desktop-contract:
    name: Desktop IPC policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - run: node --test apps/open-trade/tests/policy.test.mjs
