name: Protocol dependency integrity

on:
  pull_request:
    paths:
      - 'packages/openfund-protocol/**'
      - '.github/workflows/protocol-dependencies.yml'
  push:
    branches: [main]
    paths:
      - 'packages/openfund-protocol/**'
      - '.github/workflows/protocol-dependencies.yml'

permissions:
  contents: read

concurrency:
  group: protocol-dependencies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dependencies:
    name: Dormant protocol lockfile and toolchain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/openfund-protocol
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/openfund-protocol/package-lock.json
      - name: Install the exact isolated dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Load Hardhat and the imported plugin configuration
        run: |
          npm exec -- hardhat --version
          npm exec -- hardhat help
