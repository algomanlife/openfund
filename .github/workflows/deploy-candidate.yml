name: Deploy verified candidate
on:
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  deployments: write
concurrency:
  group: openfund-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    env:
      GITHUB_ENVIRONMENT: production
      GH_TOKEN: ${{ github.token }}
      RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
      RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
      RELEASE_PUBLIC_URL: ${{ vars.RELEASE_PUBLIC_URL }}
      RELEASE_CMS_URL: ${{ vars.RELEASE_CMS_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 26
      - name: Verify package and deploy exact candidate SHA
        run: node scripts/release/deploy-candidate.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: candidate-deployment-status-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/deployment-status.json
          retention-days: 90
