name: Unified release
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the next official batch release from main
        required: true
        default: false
        type: boolean
      release_version:
        description: Optional explicit next patch version (for an approved patch batch)
        required: false
        type: string
permissions:
  contents: read
concurrency:
  # Each PR gets its own group and a new push cancels the superseded ~40 minute
  # run. Official main/dispatch releases stay serialized and are never cancelled.
  group: ${{ github.event_name == 'pull_request' && format('openfund-pr-{0}', github.event.pull_request.number) || 'openfund-official-release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    name: Classify change (CI tier)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_gates: ${{ steps.classify.outputs.run_gates }}
      run_backend_suite: ${{ steps.classify.outputs.run_backend_suite }}
      run_presentation_matrices: ${{ steps.classify.outputs.run_presentation_matrices }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Changed files (pull requests only; main and dispatches are always full)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --paginate "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --jq '.[].filename' > "$RUNNER_TEMP/changed.txt"
      - name: Classify
        id: classify
        env:
          CI_TIER_AFFECTED: ${{ vars.CI_TIER_AFFECTED }}
        run: node scripts/ci/changes.mjs "$RUNNER_TEMP/changed.txt"
  package:
    name: Release package gates
    needs: changes
    # Skipped (reported as passing to required checks) ONLY for documentation-only
    # pull requests; main pushes and release dispatches always run every gate.
    if: (github.ref == 'refs/heads/main' || github.event_name == 'pull_request') && needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    # The full candidate build (three lockfiles, unit suites, dual frontend
    # builds, double migration, boot + the whole browser matrix — now also
    # the challenge-lifecycle journey) completed its gates and packaging at
    # ~75m on observed runs and was canceled during the final packaging
    # steps. 110 minutes keeps a hard ceiling with headroom.
    timeout-minutes: 110
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfund_release_ci
          POSTGRES_USER: openfund_ci
          POSTGRES_PASSWORD: openfund_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openfund_ci -d openfund_release_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_release_ci
      CMS_PUBLIC_URL: http://127.0.0.1:8055
      CSP_EXTRA_CONNECT: http://127.0.0.1:8055
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web-react/package-lock.json
            apps/backend/package-lock.json
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Allocate or resume immutable version
        env:
          RELEASE_REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.release_version || '' }}
          RELEASE_CANDIDATE: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
        run: node scripts/release/plan.mjs
      - name: Install browser runtime
        run: |
          npm ci --include=dev
          npx --no-install playwright install --with-deps chromium
      - name: Start isolated Directus and seed bilingual content
        run: |
          npm ci --include=dev --prefix apps/web-react
          npm ci --prefix apps/backend
          npm --prefix apps/backend run migrate
          export DIRECTUS_URL=http://127.0.0.1:8055
          export DIRECTUS_ADMIN_EMAIL=release-ci@example.com
          export DIRECTUS_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          docker run --rm -d --name openfund-package-cms --network host \
            -e DB_CLIENT=pg -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=openfund_release_ci -e DB_USER=openfund_ci -e DB_PASSWORD=openfund_ci \
            -e KEY="$(openssl rand -hex 16)" -e SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL="$DIRECTUS_ADMIN_EMAIL" -e ADMIN_PASSWORD="$DIRECTUS_ADMIN_PASSWORD" \
            -e CORS_ENABLED=true -e CORS_ORIGIN=true directus/directus:11.17.4
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs openfund-package-cms --tail 50; exit 1; fi
          bash apps/backstage/scripts/bootstrap-cms.sh
      # Includes the bilingual responsive wallet/theme/product-availability matrix.
      - name: All integrated release gates and packaging
        env:
          RELEASE_SKIP_BACKEND_SUITE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run_backend_suite == 'false' && '1' || '' }}
          RELEASE_SKIP_PRESENTATION: ${{ github.event_name == 'pull_request' && needs.changes.outputs.run_presentation_matrices == 'false' && '1' || '' }}
          RELEASE_CANDIDATE: ${{ github.event_name != 'workflow_dispatch' || !inputs.publish }}
        run: |
          if [ "$RELEASE_CANDIDATE" = true ]; then npm run release:build -- --candidate; else npm run release:build; fi
      - uses: actions/upload-artifact@v4
        with:
          name: official-release-candidate
          path: |
            output/releases/v*/*.tar.gz
            output/releases/v*/SHA256SUMS
            output/releases/v*/release-manifest.json
            output/releases/v*/verification.json
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-verification-evidence
          path: output/playwright/
          retention-days: 7
      - name: Stop isolated Directus
        if: always()
        run: docker stop openfund-package-cms >/dev/null 2>&1 || true
  secrets:
    name: Release secret scan
    permissions:
      checks: read
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9 (third-party: pinned to a commit; Dependabot proposes updates)
        if: github.event_name != 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: gitleaks.toml
          # 8.24.x does not apply path allowlists to --log-opts scans (see
          # ci.yml); pin 8.30.1 so PR gates match the CI secret scan.
          GITLEAKS_VERSION: 8.30.1
      - name: Verify the exact main commit already passed required secret scanning
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release/check-secrets.mjs
  cms:
    name: Directus bootstrap and public permissions
    needs: changes
    if: needs.changes.outputs.run_gates == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: openfund_cms_ci
          POSTGRES_USER: openfund_ci
          POSTGRES_PASSWORD: openfund_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U openfund_ci -d openfund_cms_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://openfund_ci:openfund_ci@localhost:5432/openfund_cms_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clean installs and additive application schema
        run: |
          npm ci --include=dev --prefix apps/web-react
          npm ci --prefix apps/backend
          npm --prefix apps/backend run migrate
      - name: Fresh Directus 11.17.4 bootstrap, rerun and draft isolation
        run: |
          export DIRECTUS_URL=http://127.0.0.1:8055
          export DIRECTUS_ADMIN_EMAIL=release-ci@example.com
          export DIRECTUS_ADMIN_PASSWORD="$(openssl rand -hex 20)"
          docker run --rm -d --name openfund-cms-ci --network host \
            -e DB_CLIENT=pg -e DB_HOST=127.0.0.1 -e DB_PORT=5432 \
            -e DB_DATABASE=openfund_cms_ci -e DB_USER=openfund_ci -e DB_PASSWORD=openfund_ci \
            -e KEY="$(openssl rand -hex 16)" -e SECRET="$(openssl rand -hex 32)" \
            -e ADMIN_EMAIL="$DIRECTUS_ADMIN_EMAIL" -e ADMIN_PASSWORD="$DIRECTUS_ADMIN_PASSWORD" \
            -e CORS_ENABLED=true -e CORS_ORIGIN=true directus/directus:11.17.4
          trap 'docker stop openfund-cms-ci >/dev/null' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl -fsS "$DIRECTUS_URL/server/ping" >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then docker logs openfund-cms-ci --tail 50; exit 1; fi
          bash apps/backstage/scripts/bootstrap-cms.sh
          node scripts/release/test-cms-bootstrap.mjs before
          bash apps/backstage/scripts/bootstrap-cms.sh
          node scripts/release/test-cms-bootstrap.mjs after
  production_cms:
    name: Production CMS publication gate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    env:
      CMS_PUBLIC_URL: ${{ vars.RELEASE_DIRECTUS_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify live public bilingual CMS reads
        run: node scripts/release/check-public-cms.mjs
  publish:
    needs: [package, secrets, cms, production_cms]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.published.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: official-release-candidate
          path: output/releases
      - name: Resolve previously allocated version
        env:
          RELEASE_REQUESTED_VERSION: ${{ inputs.release_version }}
        run: node scripts/release/plan.mjs
      - name: Publish immutable tag, notes and verified artifacts
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release/publish.mjs
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
  # A release published with GITHUB_TOKEN does not emit a `release` event to
  # other workflows, so the deployment is chained here (ADR 0013). It still
  # runs in the protected `production` environment and verifies the live
  # frontend/backend identity against the published manifest.
  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: read
      deployments: write
    uses: ./.github/workflows/deploy-release.yml
    with:
      version: ${{ needs.publish.outputs.tag }}
    secrets: inherit
  # Versioned GHCR image built from the verified release archive (ADR 0014).
  # Runs beside the deployment; production stays a source-built Render service.
  image:
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/package-image.yml
    with:
      version: ${{ needs.publish.outputs.tag }}
