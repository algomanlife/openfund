<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Seven development phases</title><desc id="desc">Platform foundation, trading core, product experience, production infrastructure, advanced trading, Openfund Protocol and ecosystem expansion. No dates or phase-wide completion claims.</desc><defs><radialGradient id="glow"><stop stop-color="#82e7bd" stop-opacity=".16"/><stop offset="1" stop-color="#82e7bd" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="800" rx="24" fill="#060808"/><g font-family="Ubuntu,Arial,sans-serif"><text x="48" y="56" font-size="30" fill="#e6f3ec" font-weight="600">A roadmap grounded in evidence</text><text x="48" y="88" font-size="16" fill="#afc5b8" font-weight="400">Milestone status and acceptance criteria live in docs/roadmap/MILESTONES.md.</text><circle cx="73" cy="154" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="160" font-size="16" fill="#82e7bd" font-weight="400">01</text><text x="118" y="148" font-size="22" fill="#e6f3ec" font-weight="600">Platform Foundation</text><text x="118" y="177" font-size="16" fill="#afc5b8" font-weight="400">Application, charting and market feeds delivered</text><circle cx="73" cy="245" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="251" font-size="16" fill="#82e7bd" font-weight="400">02</text><text x="118" y="239" font-size="22" fill="#e6f3ec" font-weight="600">Trading Core</text><text x="118" y="268" font-size="16" fill="#afc5b8" font-weight="400">Simulation delivered; commercial evaluation planned</text><circle cx="73" cy="336" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="342" font-size="16" fill="#82e7bd" font-weight="400">03</text><text x="118" y="330" font-size="22" fill="#e6f3ec" font-weight="600">Product Experience</text><text x="118" y="359" font-size="16" fill="#afc5b8" font-weight="400">Core views delivered; wallet acceptance remains open</text><circle cx="73" cy="427" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="433" font-size="16" fill="#82e7bd" font-weight="400">04</text><text x="118" y="421" font-size="22" fill="#e6f3ec" font-weight="600">Production Infrastructure</text><text x="118" y="450" font-size="16" fill="#afc5b8" font-weight="400">Configuration and CI delivered; deployed acceptance open</text><circle cx="73" cy="518" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="524" font-size="16" fill="#82e7bd" font-weight="400">05</text><text x="118" y="512" font-size="22" fill="#e6f3ec" font-weight="600">Advanced Trading</text><text x="118" y="541" font-size="16" fill="#afc5b8" font-weight="400">Planned; execution and authentic depth have gates</text><circle cx="73" cy="609" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="615" font-size="16" fill="#82e7bd" font-weight="400">06</text><text x="118" y="603" font-size="22" fill="#e6f3ec" font-weight="600">Openfund Protocol</text><text x="118" y="632" font-size="16" fill="#afc5b8" font-weight="400">Planned; venue adapters, aggregation and routing</text><circle cx="73" cy="700" r="23" fill="#14251b" stroke="#315340"/><text x="62" y="706" font-size="16" fill="#82e7bd" font-weight="400">07</text><text x="118" y="694" font-size="22" fill="#e6f3ec" font-weight="600">Ecosystem Expansion</text><text x="118" y="723" font-size="16" fill="#afc5b8" font-weight="400">Planned; integrations, developer services and scaling</text></g></svg>
