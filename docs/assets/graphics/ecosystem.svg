<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="750" viewBox="0 0 1280 750" role="img" aria-labelledby="title desc"><title id="title">Openfund ecosystem</title><desc id="desc">Current public discovery, shared terminal, isolated simulated Prop and read-only Perpetual products; Protocol aggregation planned.</desc><defs><radialGradient id="glow"><stop stop-color="#82e7bd" stop-opacity=".16"/><stop offset="1" stop-color="#82e7bd" stop-opacity="0"/></radialGradient></defs><rect width="1280" height="750" rx="24" fill="#060808"/><g font-family="Ubuntu,Arial,sans-serif"><text x="48" y="56" font-size="30" fill="#e6f3ec" font-weight="600">A connected trading ecosystem</text><text x="48" y="87" font-size="17" fill="#afc5b8" font-weight="400">Shared presentation. Separate financial authority.</text><rect x="48" y="120" width="1184" height="105" rx="15" fill="#0e1914" stroke="#294438"/><text x="72" y="160" font-size="22" fill="#82e7bd" font-weight="600">Discovery and identity</text><text x="72" y="193" font-size="15" fill="#afc5b8" font-weight="400">Home · Markets · Challenges · Rulebook · Wallet / SIWE</text><rect x="48" y="250" width="574" height="180" rx="15" fill="#0e1914" stroke="#294438"/><text x="72" y="290" font-size="22" fill="#82e7bd" font-weight="600">Prop Trading</text><text x="72" y="323" font-size="15" fill="#afc5b8" font-weight="400">Server-authoritative simulation</text><text x="72" y="347" font-size="15" fill="#afc5b8" font-weight="400">Virtual DAI · Persistent ledger · Risk telemetry</text><text x="72" y="409" font-size="12" fill="#C6FF52" font-weight="400">CURRENT · SIMULATED EXECUTION</text><rect x="650" y="250" width="582" height="180" rx="15" fill="#0e1914" stroke="#294438"/><text x="674" y="290" font-size="22" fill="#82e7bd" font-weight="600">Perpetual Trading</text><text x="674" y="323" font-size="15" fill="#afc5b8" font-weight="400">Gains market and wallet reads</text><text x="674" y="347" font-size="15" fill="#afc5b8" font-weight="400">Arbitrum One · Native positions and history</text><text x="674" y="409" font-size="12" fill="#C6FF52" font-weight="400">CURRENT · READ-ONLY</text><rect x="48" y="455" width="1184" height="95" rx="15" fill="#0e1914" stroke="#294438"/><text x="72" y="495" font-size="22" fill="#82e7bd" font-weight="600">Shared Vela terminal · Product Portfolio · Private Journal</text><rect x="48" y="575" width="1184" height="145" rx="15" fill="#0e1914" stroke="#294438"/><text x="72" y="615" font-size="22" fill="#82e7bd" font-weight="600">Openfund Protocol</text><text x="72" y="648" font-size="15" fill="#afc5b8" font-weight="400">Gains Network · Hyperliquid · dYdX</text><text x="72" y="672" font-size="15" fill="#afc5b8" font-weight="400">Aggregation and intelligent routing — available in the final release</text><text x="72" y="699" font-size="12" fill="#C6FF52" font-weight="400">PLANNED · NO OPERATIONAL ROUTING</text></g></svg>
