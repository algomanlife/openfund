<svg xmlns="http://www.w3.org/2000/svg" width="640" height="328" viewBox="0 0 640 328" role="img" aria-labelledby="title"><title id="title">Certificates: Purchase, Free Trial, phase-pass, final-pass and payout certificates derived from recorded evidence.</title><g font-family="Ubuntu,Segoe UI,Helvetica,Arial,sans-serif"><rect x="1" y="1" width="638" height="326" rx="24" fill="#0c1412" stroke="#1f3029" stroke-width="1.5"/><rect x="32" y="30" width="64" height="64" rx="15.36" fill="#0f1c18" stroke="#2b4a3f"/><g transform="translate(44.8 42.8) scale(1.5999999999999999)" fill="none" stroke="#82e7bd" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="5.5"/><path d="m8.5 13.5-1.5 7 5-2.5 5 2.5-1.5-7"/><path d="m10 9 1.5 1.5L14.5 7.5"/></g><text x="116" y="62" font-size="27" fill="#e6f3ec" font-weight="700" text-anchor="start">Certificates</text><text x="116" y="88" font-size="14" fill="#5d7369" font-weight="400" text-anchor="start">GLOBAL</text><rect x="534.2" y="34" width="73.80000000000001" height="26" rx="13" fill="#123326"/><text x="571.1" y="51.5" font-size="12" fill="#82e7bd" font-weight="700" text-anchor="middle">RUNNING</text><text x="32" y="132" font-size="17" fill="#93aaa0" font-weight="400" text-anchor="start">Purchase, Free Trial, phase-pass, final-pass and payout</text><text x="32" y="156" font-size="17" fill="#93aaa0" font-weight="400" text-anchor="start">certificates derived from recorded evidence.</text><circle cx="41" cy="193" r="9" fill="#123326"/><path d="M36.5 193l3 3 6-6" fill="none" stroke="#82e7bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="198" font-size="16" fill="#e6f3ec" font-weight="400" text-anchor="start">Verifiable by serial number or QR code</text><circle cx="41" cy="223" r="9" fill="#123326"/><path d="M36.5 223l3 3 6-6" fill="none" stroke="#82e7bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="60" y="228" font-size="16" fill="#e6f3ec"