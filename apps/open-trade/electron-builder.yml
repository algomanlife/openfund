# Open Trade installers. Run through scripts/package.mjs, which adds the
# channel overrides from scripts/release-plan.mjs: internal builds are
# explicitly unsigned and named "internal-unsigned"; beta/stable builds must
# sign (and notarize on macOS) or the packaging step fails.
appId: cloud.openfund.opentrade
productName: Open Trade
copyright: Copyright © Openfund
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
  - '!node_modules/**'
artifactName: Open-Trade-${version}-internal-unsigned-${os}-${arch}.${ext}
mac:
  category: public.app-category.finance
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: false
dmg:
  title: Open Trade ${version}
  background: build/background.png
  iconSize: 104
  window:
    width: 660
    height: 420
  contents:
    - x: 180
      y: 250
      type: file
    - x: 480
      y: 250
      type: link
      path: /Applications
win:
  target:
    - target: nsis
      arch: [x64]
  icon: build/icon.png
nsis:
  oneClick: false
  include: build/installer.nsh
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  shortcutName: Open Trade
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
linux:
  target: [AppImage, deb]
  category: Finance
  icon: build/icon.png
  maintainer: Openfund
  synopsis: Openfund desktop trading workspace
  description: Open Trade by Openfund — chart workspace for Openfund Prop simulated accounts and read-only Gains account records.
publish: null
