<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Open Trade app icon. Generated from brand/logos/mark-mint.svg by
       apps/open-trade/scripts/prepare.mjs ({{MARK_PATH}} is the mark). -->
  <defs>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2622"/>
      <stop offset="0.55" stop-color="#0b110f"/>
      <stop offset="1" stop-color="#040706"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="1.02" r="0.72">
      <stop offset="0" stop-color="#82e7bd" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#3fae86" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0b110f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.47" r="0.42">
      <stop offset="0" stop-color="#82e7bd" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#eafff4"/>
      <stop offset="0.38" stop-color="#9ff0cb"/>
      <stop offset="1" stop-color="#4ccf95"/>
    </linearGradient>
    <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.65"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#82e7bd" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#82e7bd" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c6ff52"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dy="16"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <symbol id="mark" viewBox="0 0 581 644"><path fill-rule="evenodd" d="{{MARK_PATH}}"/></symbol>
  </defs>

  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#aurora)"/>
    <!-- faint chart grid -->
    <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="2">
      <path d="M100 330H924M100 512H924M100 694H924"/>
      <path d="M306 100V924M512 100V924M718 100V924"/>
    </g>
    <!-- candles rising into the light -->
    <g fill="#82e7bd">
      <rect x="168" y="760" width="22" height="86" rx="5" opacity="0.18"/>
      <rect x="230" y="728" width="22" height="104" rx="5" opacity="0.22"/>
      <rect x="292" y="748" width="22" height="70" rx="5" fill="#ef676c" opacity="0.22"/>
      <rect x="354" y="690" width="22" height="118" rx="5" opacity="0.26"/>
      <rect x="648" y="640" width="22" height="120" rx="5" opacity="0.26"/>
      <rect x="710" y="664" width="22" height="78" rx="5" fill="#ef676c" opacity="0.24"/>
      <rect x="772" y="590" width="22" height="134" rx="5" opacity="0.3"/>
      <rect x="834" y="548" width="22" height="128" rx="5" opacity="0.34"/>
    </g>
    <!-- trend line with glow -->
    <path d="M120 820 L230 776 L300 792 L380 722 L470 742 L560 668 L650 690 L740 600 L820 618 L905 520"
          fill="none" stroke="#82e7bd" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#glow)"/>
    <path d="M120 820 L230 776 L300 792 L380 722 L470 742 L560 668 L650 690 L740 600 L820 618 L905 520"
          fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="905" cy="520" r="26" fill="#c6ff52" opacity="0.35" filter="url(#glow)"/>
    <circle cx="905" cy="520" r="9" fill="#efffd6"/>
    <!-- halo behind the glass gem -->
    <circle cx="512" cy="470" r="340" fill="url(#halo)"/>
    <!-- liquid-glass hexagon gem -->
    <g filter="url(#shadow)">
      <path d="M512 178 L770 327 Q790 338 790 361 L790 621 Q790 644 770 655 L532 793 Q512 805 492 793 L254 655 Q234 644 234 621 L234 361 Q234 338 254 327 Z"
            fill="url(#glassFill)" stroke="url(#glassEdge)" stroke-width="4"/>
    </g>
    <!-- glass top reflection -->
    <path d="M512 196 L756 337 Q770 345 770 361 L770 400 Q512 330 254 400 L254 361 Q254 345 268 337 Z"
          fill="#ffffff" opacity="0.07"/>
    <!-- the Openfund mark: glow, then gradient body -->
    <use href="#mark" x="352" y="306" width="320" height="354" fill="#82e7bd" opacity="0.7" filter="url(#soft)"/>
    <use href="#mark" x="352" y="306" width="320" height="354" fill="url(#markFill)"/>
    <!-- top glass sheen of the whole tile -->
    <path d="M100 100 H924 V360 Q512 250 100 380 Z" fill="url(#sheen)"/>
  </g>
  <!-- rim light -->
  <rect x="101.5" y="101.5" width="821" height="821" rx="185" fill="none" stroke="url(#rim)" stroke-width="3"/>
</svg>
