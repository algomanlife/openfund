<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- macOS installer window (DMG). Finder draws the app and Applications
       icons at (180, 250) and (480, 250); see electron-builder.yml dmg.contents.
       {{MARK_PATH}} and {{VERSION}} are filled in by scripts/prepare.mjs. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f8f7"/>
      <stop offset="1" stop-color="#e7ece9"/>
    </linearGradient>
    <radialGradient id="mint" cx="0.5" cy="1.15" r="0.75">
      <stop offset="0" stop-color="#82e7bd" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#5fd9a0"/>
      <stop offset="1" stop-color="#2f9e73"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 581 644"><path fill-rule="evenodd" d="{{MARK_PATH}}"/></symbol>
  </defs>
  <rect width="660" height="420" fill="url(#bg)"/>
  <rect width="660" height="420" fill="url(#mint)"/>
  <g stroke="#0b110f" stroke-opacity="0.05">
    <path d="M0 140H660M0 280H660M165 0V420M330 0V420M495 0V420"/>
  </g>
  <!-- header -->
  <use href="#mark" x="40" y="34" width="34" height="38" fill="url(#markFill)"/>
  <text x="86" y="58" font-family="Ubuntu" font-weight="700" font-size="24" fill="#111614" letter-spacing="-0.5">Open Trade</text>
  <text x="88" y="78" font-family="Ubuntu" font-size="11" fill="#5b6661" letter-spacing="1.6">BY OPENFUND · v{{VERSION}}</text>
  <text x="620" y="54" text-anchor="end" font-family="Ubuntu" font-size="12" fill="#3a4540">Desktop trading workspace</text>
  <text x="620" y="72" text-anchor="end" font-family="Ubuntu" font-size="11" fill="#6c7772">Prop accounts · read-only Gains records</text>
  <!-- glass stage for the two icons -->
  <rect x="40" y="120" width="580" height="222" rx="22" fill="url(#glass)" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="40.5" y="120.5" width="579" height="221" rx="21.5" fill="none" stroke="#0b110f" stroke-opacity="0.06"/>
  <text x="330" y="152" text-anchor="middle" font-family="Ubuntu" font-size="13" fill="#2b3531">Drag Open Trade into Applications to install</text>
  <!-- arrow -->
  <g fill="none" stroke="#3fbf8b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M262 250 H392" stroke-dasharray="2 9"/>
    <path d="M384 238 L398 250 L384 262"/>
  </g>
  <!-- footer -->
  <text x="40" y="384" font-family="Ubuntu" font-weight="700" font-size="11" fill="#2f9e73">openfi.cloud</text>
  <text x="116" y="384" font-family="Ubuntu" font-size="11" fill="#5b6661">·  github.com/algomanlife/openfund  ·  open source</text>
  <text x="620" y="384" text-anchor="end" font-family="Ubuntu" font-size="10" fill="#8a948f">Internal beta — not for public distribution</text>
</svg>
