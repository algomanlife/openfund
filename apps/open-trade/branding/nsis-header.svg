      <stop offset="0" stop-color="#5fd9a0"/>
      <stop offset="1" stop-color="#2f9e73"/>
    </linearGradient>
    <symbol id="mark" viewBox="0 0 581 644"><path fill-rule="evenodd" d="{{MARK_PATH}}"/></symbol>
  </defs>
  <rect width="150" height="57" fill="#ffffff"/>
