  <text x="96" y="27" text-anchor="end" font-family="Ubuntu" font-weight="700" font-size="12" fill="#111614">Open Trade</text>
  <text x="96" y="40" text-anchor="end" font-family="Ubuntu" font-size="8" fill="#2f9e73">openfi.cloud</text>
