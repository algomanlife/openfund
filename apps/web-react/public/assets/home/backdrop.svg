<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
  <!-- Openfund original — "The Gathering" backdrop (home background scene)
       Spirit: a community gathering around a glowing core — towers, pines,
       a central platform, floating network holograms. Palette: mint 82e7bd
       glow over deep greens on near-black; low contrast so text stays
       readable. Pure CSS motion; honors prefers-reduced-motion. -->
  <style>
    .fog { animation: drift 46s ease-in-out infinite alternate; }
    .fog2 { animation: drift 62s ease-in-out -18s infinite alternate-reverse; }
    .twinkle { animation: tw 4.2s ease-in-out infinite; }
    .t2 { animation-delay: -1.4s; } .t3 { animation-delay: -2.8s; }
    .core { animation: corepulse 5.6s ease-in-out infinite; }
    .beam { animation: beambreathe 7s ease-in-out infinite; }
    .net { animation: netdrift 26s ease-in-out infinite alternate; }
    .spark { animation: rise 9s linear infinite; }
    .spark2 { animation: rise 9s linear -4.5s infinite; }
    @keyframes drift { from { transform: translateX(-36px) } to { transform: translateX(36px) } }
    @keyframes tw { 0%,100% { opacity: .18 } 50% { opacity: .95 } }
    @keyframes corepulse { 0%,100% { opacity: .5; transform: scale(1) } 50% { opacity: 1; transform: scale(1.06) } }
    @keyframes beambreathe { 0%,100% { opacity: .16 } 50% { opacity: .42 } }
    @keyframes netdrift { from { transform: translateY(0) } to { transform: translateY(-14px) } }
    @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 12% { opacity: .8 } 100% { transform: translateY(-120px); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <defs>
    <linearGradient id="skyG" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#0b1411" stop-opacity="0"/>
      <stop offset=".55" stop-color="#0d1a13" stop-opacity=".85"/>
      <stop offset="1" stop-color="#06110c"/>
    </linearGradient>
    <radialGradient id="coreG" cx=".5" cy=".5" r=".5">
      <stop stop-color="#82e7bd" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#82e7bd" stop-opacity=".25"/>
      <stop offset="1" stop-color="#82e7bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="groundG" x1="0" x2="0" y1="0" y2="1">
      <stop stop-color="#0a1510"/>
      <stop offset="1" stop-color="#060b08"/>
    </linearGradient>
  </defs>

  <!-- sky wash -->
  <rect x="0" y="0" width="1440" height="620" fill="url(#skyG)"/>

  <!-- distant towers with lit windows (left & right flanks) -->
  <g opacity=".65">
    <g fill="#0d1a13">
      <rect x="66" y="330" width="54" height="200" rx="6"/>
      <rect x="130" y="292" width="70" height="238" rx="6"/>
      <rect x="212" y="352" width="44" height="178" rx="6"/>
      <rect x="1198" y="312" width="58" height="218" rx="6"/>
      <rect x="1272" y="352" width="76" height="178" rx="6"/>
      <rect x="1360" y="338" width="48" height="192" rx="6"/>
    </g>
    <g fill="#82e7bd">
      <rect x="82" y="352" width="7" height="9" rx="2" opacity=".8" class="twinkle"/>
      <rect x="100" y="380" width="7" height="9" rx="2" opacity=".55" class="twinkle t2"/>
      <rect x="146" y="318" width="7" height="9" rx="2" opacity=".7" class="twinkle t3"/>
      <rect x="170" y="346" width="7" height="9" rx="2" opacity=".5" class="twinkle"/>
      <rect x="188" y="376" width="7" height="9" rx="2" opacity=".75" class="twinkle t2"/>
      <rect x="228" y="374" width="7" height="9" rx="2" opacity=".6" class="twinkle t3"/>
      <rect x="1214" y="338" width="7" height="9" rx="2" opacity=".75" class="twinkle t2"/>
      <rect x="1240" y="368" width="7" height="9" rx="2" opacity=".55" class="twinkle"/>
      <rect x="1296" y="380" width="7" height="9" rx="2" opacity=".7" class="twinkle t3"/>
      <rect x="1322" y="410" width="7" height="9" rx="2" opacity=".5" class="twinkle t2"/>
      <rect x="1376" y="360" width="7" height="9" rx="2" opacity=".65" class="twinkle"/>
    </g>
    <!-- tower antenna lights -->
    <circle cx="165" cy="286" r="3.4" fill="#82e7bd" class="twinkle"/>
    <circle cx="1310" cy="306" r="3.4" fill="#82e7bd" class="twinkle t2"/>
  </g>

  <!-- pine groves framing the scene -->
  <g fill="#0b1712">
    <path d="M28 620 l24-52 24 52 z M40 620 l16-84 16 84 z"/>
    <path d="M286 620 l30-64 30 64 z M300 620 l20-102 20 102 z"/>
    <path d="M1136 620 l26-56 26 56 z M1150 620 l18-92 18 92 z"/>
    <path d="M1394 620 l22-48 22 48 z"/>
  </g>

  <!-- rolling ground -->
  <path d="M0 470 q210 -34 420 -6 q230 30 430 -18 q240 -40 590 10 v164 H0 z" fill="url(#groundG)"/>

  <!-- central gathering platform -->
  <g>
    <ellipse cx="720" cy="560" rx="230" ry="30" fill="#0d1a13"/>
    <ellipse cx="720" cy="552" rx="196" ry="22" fill="none" stroke="#82e7bd55" stroke-width="2.5"/>
    <ellipse cx="720" cy="540" rx="150" ry="15" fill="#0f2117" stroke="#82e7bd33" stroke-width="2"/>
    <!-- glowing core (the "fire") -->
    <g class="core" style="transform-origin:720px 532px">
      <ellipse cx="720" cy="532" rx="86" ry="26" fill="url(#coreG)"/>
      <circle cx="720" cy="528" r="11" fill="#d9f4e6"/>
      <circle cx="720" cy="528" r="20" fill="none" stroke="#82e7bd" stroke-width="2" opacity=".7"/>
      <circle cx="720" cy="528" r="32" fill="none" stroke="#82e7bd" stroke-width="1.6" opacity=".4"/>
    </g>
    <!-- soft beams rising from the core -->
    <path class="beam" d="M720 528 L560 300 L640 300 Z" fill="#82e7bd"/>
    <path class="beam" d="M720 528 L880 300 L800 300 Z" fill="#82e7bd"/>
    <!-- sparks rising -->
    <circle class="spark" cx="690" cy="500" r="3" fill="#d9f4e6"/>
    <circle class="spark2" cx="742" cy="508" r="2.4" fill="#82e7bd"/>
  </g>

  <!-- floating hologram network above the platform -->
  <g class="net">
    <g stroke="#82e7bd" stroke-width="1.6" fill="none" opacity=".5" stroke-dasharray="3 8">
      <path d="M560 262 L672 216 L800 244 L900 196 L672 216 M672 216 L700 300 M800 244 L760 320"/>
    </g>
    <g fill="#0f2117" stroke="#82e7bd" stroke-width="2">
      <rect x="548" y="250" width="24" height="24" rx="6" transform="rotate(45 560 262)"/>
      <rect x="660" y="204" width="24" height="24" rx="6" transform="rotate(45 672 216)"/>
      <rect x="788" y="232" width="24" height="24" rx="6" transform="rotate(45 800 244)"/>
      <rect x="888" y="184" width="24" height="24" rx="6" transform="rotate(45 900 196)"/>
      <circle cx="700" cy="300" r="13"/>
      <circle cx="760" cy="320" r="10"/>
    </g>
    <g fill="#82e7bd">
      <circle cx="560" cy="262" r="4" class="twinkle"/>
      <circle cx="672" cy="216" r="4" class="twinkle t2"/>
      <circle cx="800" cy="244" r="4" class="twinkle t3"/>
      <circle cx="900" cy="196" r="4" class="twinkle"/>
      <circle cx="700" cy="300" r="3.4" class="twinkle t2"/>
      <circle cx="760" cy="320" r="2.8" class="twinkle t3"/>
    </g>
  </g>

  <!-- ambient fog bands -->
  <ellipse class="fog" cx="420" cy="500" rx="360" ry="46" fill="#82e7bd" opacity=".05"/>
  <ellipse class="fog2" cx="1020" cy="470" rx="320" ry="40" fill="#82e7bd" opacity=".04"/>
</svg>
