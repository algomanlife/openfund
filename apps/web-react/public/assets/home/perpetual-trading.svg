<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" role="img" aria-label="Openfund market data engine">
  <!-- Openfund original — "The Market Engine" (product B illustration)
       Spirit: a dedicated machine streaming live market data — glowing
       lenses, a holographic lozenge core and data ribbons. Palette: mint
       82e7bd glow on deep-green casings, one warm accent, transparent bg. -->
  <style>
    .o { stroke: #06110c; stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
    .o2 { stroke: #06110c; stroke-width: 2.4; stroke-linejoin: round; stroke-linecap: round; }
    .lens { animation: lens 3.6s ease-in-out infinite; }
    .l2 { animation: lens 3.6s ease-in-out -1.2s infinite; }
    .l3 { animation: lens 3.6s ease-in-out -2.4s infinite; }
    .l4 { animation: lens 3.6s ease-in-out -3s infinite; }
    .holo { animation: holo 5s ease-in-out infinite; }
    .tick { animation: travel 2.6s linear infinite; }
    .tick2 { animation: travel 2.6s linear -1.3s infinite; }
    .grid { animation: pulse 4s ease-in-out infinite; }
    @keyframes lens { 0%,100% { opacity: .4 } 50% { opacity: 1 } }
    @keyframes holo { 0%,100% { transform: translateY(0) rotate(0deg) } 50% { transform: translateY(-10px) rotate(3deg) } }
    @keyframes travel { 0% { transform: translateX(0); opacity: 0 } 12% { opacity: 1 } 88% { opacity: 1 } 100% { transform: translateX(120px); opacity: 0 } }
    @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: .8 } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <!-- ===== main housing (screen unit) ===== -->
  <rect class="o" x="96" y="96" width="230" height="180" rx="14" fill="#0f1c15"/>
  <rect class="o2" x="112" y="112" width="198" height="132" rx="10" fill="#071009"/>
  <!-- screen grid + price ribbon -->
  <g class="grid">
    <path d="M124 152h174 M124 186h174 M124 220h174" stroke="#82e7bd22" stroke-width="2"/>
    <path d="M158 124v112 M198 124v112 M238 124v112 M278 124v112" stroke="#82e7bd14" stroke-width="2"/>
  </g>
  <!-- live price ticks traveling the ribbon -->
  <g class="tick"><rect x="120" y="140" width="26" height="10" rx="4" fill="#82e7bd"/></g>
  <g class="tick2"><rect x="120" y="196" width="18" height="10" rx="4" fill="#5fae8c"/></g>
  <path d="M124 236 h60" stroke="#82e7bd" stroke-width="3" stroke-linecap="round" class="lens"/>

  <!-- holographic lozenge core over the screen -->
  <g class="holo">
    <path class="o" d="M206 132 l40 24 v44 l-40 24 -40 -24 v-44 z" fill="#0f2117"/>
    <path class="o2" d="M206 156 l22 14 v26 l-22 14 -22 -14 v-26 z" fill="#82e7bd" opacity=".85"/>
    <path class="o2" d="M206 132 v44" stroke="#d9f4e6"/>
    <circle cx="206" cy="176" r="4" fill="#d9f4e6"/>
  </g>

  <!-- corner lenses -->
  <g>
    <circle class="o2 lens" cx="118" cy="118" r="11" fill="#0b1411"/>
    <circle cx="118" cy="118" r="4" fill="#d9f4e6"/>
    <circle class="o2 l2" cx="304" cy="118" r="9" fill="#0b1411"/>
    <circle cx="304" cy="118" r="3.4" fill="#82e7bd"/>
    <circle class="o2 l3" cx="118" cy="238" r="9" fill="#0b1411"/>
    <circle cx="118" cy="238" r="3.4" fill="#82e7bd"/>
    <circle class="o2 l4" cx="304" cy="238" r="11" fill="#0b1411"/>
    <circle cx="304" cy="238" r="4" fill="#d9f4e6"/>
  </g>

  <!-- ===== side module (warm accent casing) ===== -->
  <rect class="o" x="326" y="72" width="86" height="128" rx="10" fill="#173024"/>
  <rect class="o2" x="340" y="88" width="58" height="72" rx="6" fill="#0f1c15"/>
  <g fill="#82e7bd">
    <rect x="350" y="100" width="38" height="8" rx="3" opacity=".85"/>
    <rect x="350" y="116" width="26" height="8" rx="3" opacity=".55"/>
    <rect x="350" y="132" width="32" height="8" rx="3" opacity=".35"/>
  </g>
  <circle class="o2" cx="359" cy="178" r="8" fill="#e89483"/>
  <circle class="o2" cx="383" cy="178" r="8" fill="#0b1411"/>
  <path class="o" d="M338 200 h62 l-8 18 h-54 z" fill="#122719"/>
  <path class="o" d="M362 218 l10 26 h-14 z" fill="#0d1d14"/>

  <!-- ===== base / stand ===== -->
  <rect class="o" x="120" y="276" width="206" height="26" rx="8" fill="#14241a"/>
  <g fill="#0b1411"><rect x="140" y="284" width="7" height="4" rx="1"/><rect x="152" y="284" width="7" height="4" rx="1"/><rect x="164" y="284" width="7" height="4" rx="1"/></g>
  <rect class="o2" x="196" y="288" width="18" height="10" rx="3" fill="#82e7bd" opacity=".9"/>
  <path class="o" d="M188 302 q-26 22 -54 26 l-16 14 22 8 q34 -12 62 -40 z" fill="#173024"/>
  <path class="o" d="M256 302 q26 22 54 26 l16 14 -22 8 q-34 -12 -62 -40 z" fill="#173024"/>
  <rect class="o" x="118" y="330" width="116" height="14" rx="6" fill="#122719"/>
  <rect class="o" x="288" y="330" width="116" height="14" rx="6" fill="#122719"/>

  <!-- cables -->
  <path class="o2" d="M112 236 q-26 20 -18 60 q4 26 -8 44" fill="none" stroke="#2f7d66"/>
  <path class="o2" d="M316 226 q30 24 22 66 q-6 28 10 48" fill="none" stroke="#2f7d66"/>

  <!-- floating holo chips around the machine -->
  <g class="holo"><rect class="o2" x="52" y="88" width="34" height="34" rx="9" fill="#0f2117" transform="rotate(45 69 105)"/><circle cx="69" cy="105" r="5" fill="#82e7bd"/></g>
  <g class="l2"><rect class="o2" x="438" y="150" width="26" height="26" rx="7" fill="#0f2117" transform="rotate(45 451 163)"/><circle cx="451" cy="163" r="4" fill="#d9f4e6"/></g>
  <g class="l3"><circle class="o2" cx="472" cy="70" r="13" fill="#0f2117"/><circle cx="472" cy="70" r="4.4" fill="#82e7bd"/></g>
  <!-- connection lines -->
  <path d="M96 112 L52 105 M336 96 L438 150 M320 110 L472 70" stroke="#82e7bd44" stroke-width="2" stroke-dasharray="2 7" class="grid"/>

  <ellipse cx="260" cy="368" rx="210" ry="12" fill="#06110c" opacity=".25"/>
</svg>
