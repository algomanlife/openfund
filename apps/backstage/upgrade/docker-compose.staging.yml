# Image-level Directus rehearsal stack (disposable). Executed on 2026-11-16/17 with
# directus/directus:11.17.4 + postgres:17-alpine for the launch-completion rehearsal
# (docs/reviews/launch-completion/CMS_REHEARSAL.md). Run it before any production change.
#
#   export STAGING_PG_PASSWORD=$(openssl rand -hex 16)
#   export DIRECTUS_IMAGE=docker.io/directus/directus:11.17.4
#   docker compose -f docker-compose.staging.yml up -d
#   (the bootstrap needs the application tables in the same database: publish the
#    database port with a local override file and run `npm --prefix apps/backend run migrate`
#    and `seed-plans` against it, then ../scripts/bootstrap-cms.sh and
#    ../scripts/seed_interface_content.py — twice, to prove idempotency)
#   node visual-editing-check.mjs   # with the site's CMS_PUBLIC_URL pointing here
#
# A Directus 12 image stays blocked on the owner licence decision (DIRECTUS_12_ASSESSMENT.md).
# Binds to localhost only; throw-away secrets; never point at the production database.
services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: openfund_cms_staging
      POSTGRES_USER: openfund_cms
      POSTGRES_PASSWORD: ${STAGING_PG_PASSWORD:?set a throw-away password}
    volumes:
      - ./staging-data/database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfund_cms -d openfund_cms_staging"]
      interval: 5s
      retries: 10
  directus:
    image: ${DIRECTUS_IMAGE:?set DIRECTUS_IMAGE}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8055:8055"
    volumes:
      - ./staging-data/uploads:/directus/uploads
    environment:
      KEY: staging-key-not-secret-0000000000000001
      SECRET: staging-secret-not-secret-00000000000001
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ${STAGING_PG_PASSWORD}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: "5432"
      DB_DATABASE: openfund_cms_staging
      DB_USER: openfund_cms
      DB_PASSWORD: ${STAGING_PG_PASSWORD}
      PUBLIC_URL: http://127.0.0.1:8055
      WEBSOCKETS_ENABLED: "false"
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: GET,HEAD,OPTIONS
      IP_TRUST_PROXY: "true"
      TELEMETRY: "false"
